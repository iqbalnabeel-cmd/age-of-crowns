# Age of Crowns — the multiplayer world server.
#
# Nabeel deploys this from a browser, not a command line: connect this repo to Cloudflare Workers
# once and every upload deploys it. See DEPLOY-SERVER.md for the six steps.

name = "age-of-crowns"
main = "worker.js"
compatibility_date = "2026-01-01"

[[durable_objects.bindings]]
name = "WORLD"
class_name = "World"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["World"]
