<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age of Crowns</title>
<style>
:root{
  --bg:#171310; --panel:#241d17; --panel2:#2e2620; --border:#5a4730;
  --gold:#c9a227; --text:#e8dcc8; --muted:#a89878; --danger:#c94040; --ok:#5aa858;
  --sea:#a9b7ab; --parch:#e4d7b8; --ink:#4a3b28;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;height:100vh;overflow:hidden}
button{font-family:inherit;cursor:pointer;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 12px}
button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--gold);color:#1a1512;font-weight:bold;border-color:var(--gold)}
button.primary:hover:not(:disabled){background:#e0b830;color:#1a1512}
h1,h2,h3{font-weight:normal}
#start{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;padding:30px 20px}
#start .inner{max-width:820px;margin:0 auto;text-align:center}
#start h1{font-size:44px;color:var(--gold);letter-spacing:3px;margin-bottom:4px}
#start .sub{color:var(--muted);margin-bottom:26px;font-style:italic}
#start h2{font-size:20px;margin:18px 0 10px;color:var(--gold)}
.empgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.empcard{background:var(--panel);border:2px solid var(--border);border-radius:8px;padding:12px;cursor:pointer;text-align:left}
.empcard:hover{border-color:var(--gold)}
.empcard.sel{border-color:var(--gold);background:var(--panel2)}
.empcard .dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:8px;vertical-align:-2px}
.empcard .region{color:var(--muted);font-size:13px;margin-top:4px}
.rivalrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.rival{background:var(--panel);border:2px solid var(--border);border-radius:20px;padding:6px 14px;cursor:pointer;font-size:14px}
.rival.sel{border-color:var(--gold);color:var(--gold)}
.rival.off{opacity:.3;pointer-events:none}
#startBtn{margin-top:24px;font-size:18px;padding:10px 40px}
#startMsg{color:var(--muted);margin-top:10px;font-size:14px}
#game{display:none;height:100vh;flex-direction:column}
#hdr{display:flex;align-items:center;gap:16px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
#hdr .title{color:var(--gold);font-size:20px;letter-spacing:2px}
#hdr .stat{font-size:14px;color:var(--muted)}
#hdr .stat b{color:var(--text)}
#hdr .empbadge{display:flex;align-items:center;gap:6px;font-size:15px}
#hdr .empbadge .dot{width:12px;height:12px;border-radius:50%}
#hdr .right{margin-left:auto;display:flex;gap:8px}
#main{display:flex;flex:1;min-height:0}
#mapwrap{flex:1;min-width:0;position:relative;overflow:hidden;background:var(--sea);perspective:1400px}
#tiltbox{width:100%;height:100%;transition:transform .4s}
#mapwrap.tilted #tiltbox{transform:rotateX(14deg) scale(1.06);transform-origin:50% 42%}
#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#map.dragging{cursor:grabbing}
#zoomctl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
#zoomctl button{width:36px;height:36px;font-size:19px;padding:0}
#zoomctl{transition:right .22s ease,bottom .22s ease}
#mapwrap.drawered #zoomctl{right:342px}
/* ---- CoN-style chrome (pass 3c) ---- */
#rail{width:74px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:4px;padding:8px 5px;overflow-y:auto;flex:none;z-index:7}
.rbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border:1px solid transparent;background:transparent;border-radius:8px;position:relative}
.rbtn:hover{border-color:var(--gold);background:var(--panel2)}
.rbtn .ric{font-size:19px;line-height:1;color:var(--gold)}
.rbtn .rlb{font-size:9.5px;color:var(--muted);letter-spacing:0.4px;white-space:nowrap}
#logBadge{position:absolute;top:3px;right:8px;background:var(--danger);color:#fff;border-radius:8px;font-size:9px;min-width:14px;padding:1px 3px;display:none;text-align:center}
#main.railmin #rail{width:34px;padding:6px 2px}
#main.railmin .rlb{display:none}
#main.railmin .ric{font-size:16px}
#drawer{position:absolute;top:0;right:0;bottom:0;width:330px;max-width:92%;background:rgba(24,19,14,.96);border-left:1px solid var(--gold);z-index:8;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s ease}
#drawer.open{transform:translateX(0)}
#dHead{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 4px}
#dHead span{color:var(--gold);font-size:17px}
#dHead button,#dHead2 button{border:none;background:transparent;font-size:20px;color:var(--muted);padding:0 6px}
#dHead button:hover,#dHead2 button:hover{color:var(--gold)}
#logdrawer{position:absolute;top:0;right:0;bottom:0;width:310px;max-width:88%;background:rgba(24,19,14,.97);border-left:1px solid var(--border);z-index:9;transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column}
#logdrawer.open{transform:translateX(0)}
#dHead2{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 4px}
#dHead2 h3{color:var(--gold);font-size:16px}
#log{flex:1;overflow-y:auto;padding:0 12px 12px;font-size:13px;color:var(--muted);line-height:1.5}
#log .l{border-bottom:1px solid #3a3025;padding:4px 0}
#log .turnmark{color:var(--gold)}
.dtabs{display:flex;border-bottom:1px solid var(--border);margin:0 -12px 8px}
.dtabs button{flex:1;border:none;border-radius:0;background:transparent;padding:7px;color:var(--muted);font-size:13px}
.dtabs button.on{color:var(--gold);border-bottom:2px solid var(--gold)}
.dcRow{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:12.5px;color:var(--muted)}
.dcRow b{color:var(--text)}
.dcRow button{margin-left:auto;font-size:12px;padding:4px 10px;flex:none}
#panel{padding:4px 12px 12px;overflow-y:auto;flex:1 1 auto;min-height:0;-webkit-overflow-scrolling:touch}
#dHead{flex:0 0 auto}
#panel h3{color:var(--gold);font-size:16px;margin-bottom:6px}
#panel .meta{color:var(--muted);font-size:13px;margin-bottom:8px}
.utable{width:100%;font-size:13px;border-collapse:collapse;margin-bottom:8px}
.utable td{padding:3px 4px;border-bottom:1px solid #3a3025}
.utable td:last-child{text-align:right}
.buildrow{display:flex;align-items:center;justify-content:space-between;font-size:13px;margin:3px 0}
.buildrow button{padding:2px 10px;font-size:13px}
.steprow{display:flex;align-items:center;justify-content:space-between;font-size:13px;margin:3px 0}
.steprow input{width:52px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:2px 4px;font-family:inherit}
/* map styling */
.cell{stroke:#9a8c72;stroke-width:0.7;stroke-opacity:0.5;cursor:pointer;vector-effect:non-scaling-stroke}
.seacell{fill:var(--sea);stroke:#93a598;stroke-width:0.6;stroke-opacity:0.55;cursor:pointer;vector-effect:non-scaling-stroke}
.seacell.stgt{fill:#bcd0c2;stroke:var(--gold);stroke-width:1.6;stroke-opacity:1}
.seacell.ssel{stroke:#fffbe8;stroke-width:2;stroke-opacity:1}
.road{stroke:#a98d63;stroke-width:1.6;stroke-linecap:round;opacity:0.7;vector-effect:non-scaling-stroke;pointer-events:none}
.roadcase{stroke:#6b573a;stroke-width:3.4;stroke-linecap:round;opacity:0.3;vector-effect:non-scaling-stroke;pointer-events:none}
.cellpip{fill:#7a684a;opacity:0.4;pointer-events:none}
.cell.target{stroke:var(--gold);stroke-width:1.6;stroke-dasharray:3 2.4}
.cell.pathhl{stroke:#fffbe8;stroke-width:1.8}
.cell.occupied{stroke:#6e5a3a;stroke-width:0.9;stroke-dasharray:2.4 1.8}
.cell.atwar{stroke:#a33636;stroke-width:1.1;vector-effect:non-scaling-stroke}
.provline.warline{stroke:#7d1a1a;stroke-width:2.6}
.provhalo.warline{stroke:#ff8f76;stroke-width:5;opacity:0.8}
.provline{stroke:#3a2d1c;stroke-width:1.7;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.provhalo{stroke:#f0e6cd;stroke-width:4.2;stroke-linejoin:round;opacity:0.45;vector-effect:non-scaling-stroke;pointer-events:none}
.armyfig{cursor:pointer}
.searoute{fill:none;stroke:#5d7d8a;stroke-width:2;stroke-dasharray:7 6;opacity:.8;pointer-events:none}
.searoute.target{stroke:var(--gold);stroke-width:3;opacity:1}
.mt{fill:#8d7f63;opacity:.75;pointer-events:none}
.pin circle{stroke:#241d17;stroke-width:1.4;cursor:pointer}
.pin text{pointer-events:none}
.pin .lbl{font-size:16px;fill:#241a10;text-anchor:middle;paint-order:stroke;stroke:#f3ecd8;stroke-width:3.6px;font-weight:bold;letter-spacing:0.3px}
.pin .cap{font-size:14px;fill:#8a6a10;text-anchor:middle;paint-order:stroke;stroke:#efe6cd;stroke-width:2.5px}
.bcard{display:flex;gap:10px;margin:8px 0}
.bcol{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px;min-width:0}
.bcol h4{font-size:13px;padding:4px 6px;border-radius:5px;margin-bottom:4px;color:#fff;font-weight:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcol .tot{font-size:19px;color:var(--text);margin:2px 0 6px;text-align:center}
.brow{display:flex;align-items:center;gap:5px;font-size:12.5px;padding:2px 0;border-bottom:1px solid #3a3025}
.brow:last-child{border-bottom:none}
.brow .n{margin-left:auto;font-weight:bold}
.uic{width:14px;height:14px;vertical-align:-2px;margin-right:4px;flex:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:60}
#modal .box{background:var(--panel);border:2px solid var(--gold);border-radius:10px;padding:22px;max-width:540px;width:94%;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
#modal h3{color:var(--gold);font-size:20px;margin-bottom:10px}
#modal .body{font-size:14px;line-height:1.6;margin-bottom:14px;overflow-y:auto;flex:1 1 auto;min-height:0}
#modal .body .good{color:var(--ok)} #modal .body .bad{color:var(--danger)}
#modal .btns{display:flex;gap:10px;justify-content:flex-end;flex:0 0 auto}
.ucards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ucard{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:12.5px}
.ucard h4{color:var(--gold);font-size:15px;font-weight:normal;margin:4px 0 2px}
.ucard .stats{color:var(--muted);margin:3px 0}
.ucard .flav{font-style:italic;color:var(--muted);margin-top:5px;line-height:1.45}
.ucard .vs{margin-top:4px}
#contBtn{margin-top:12px;font-size:16px;padding:9px 30px;display:none}
#impWrap{max-width:480px;margin:18px auto 0}
#impWrap textarea{width:100%;height:60px;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px;font-size:11px;font-family:monospace}
#impMsg{color:var(--danger);font-size:13px;margin-top:4px;min-height:16px}
#abar{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:10px;z-index:6;background:rgba(24,19,14,.96);border:1px solid var(--gold);border-radius:12px;padding:10px 12px;max-width:96%;width:640px;max-height:46%;overflow-y:auto}
.dcHead{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.crest{width:22px;height:22px;border-radius:50%;border:2px solid #241d17;flex:none}
.dcT{min-width:0;margin-right:auto}
.dcTitle{color:var(--gold);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcSub{color:var(--muted);font-size:11.5px}
.pill{border:1px solid var(--border);border-radius:11px;padding:2px 10px;font-size:11.5px;color:var(--text);flex:none;white-space:nowrap}
.pill.ok{border-color:#5aa858;color:#7ec97e}
.pill.bad{border-color:var(--danger);color:var(--danger)}
.dcBody{display:flex;gap:9px;align-items:stretch}
.dcSum{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;text-align:center;flex:none;display:flex;flex-direction:column;justify-content:center;gap:1px}
.dcSum .lb{font-size:9.5px;color:var(--muted);letter-spacing:1px}
.dcSum .vl{font-size:16px;font-weight:bold}
.dcSum .gold{color:var(--gold)}
.dcTiles{display:flex;gap:7px;overflow-x:auto;flex:1;min-width:0}
.tile{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:5px 6px 6px;flex:none;width:74px;text-align:center;position:relative}
.tile .tn{position:absolute;top:4px;right:6px;font-size:12px;font-weight:bold}
.rbar{height:4px;background:#3a3025;border-radius:2px;margin:3px 1px}
.rbar div{height:4px;background:#5aa858;border-radius:2px}
.tstep{display:flex;align-items:center;justify-content:space-between;gap:2px}
.tstep button{padding:0 7px;font-size:13px;line-height:18px}
.tstep span{font-size:13px;font-weight:bold;color:var(--gold)}
.dcAct{display:flex;flex-direction:column;gap:6px;flex:none;justify-content:center}
.dcAct>div{display:flex;gap:6px}
.dcAct>div button{flex:1}
.dcAct button{font-size:12.5px;padding:6px 10px;white-space:nowrap}
.trow{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:7px}
.trow svg{flex:none}
.tinfo{flex:1;min-width:0}
.tname{font-size:15px;color:var(--text)}
.pips{color:var(--gold);font-size:12px;letter-spacing:2px;margin-left:4px}
.tdesc{font-size:12px;color:var(--muted)}
.tnext{font-size:12px;color:var(--text);margin-top:2px}
.trow button{flex:none;min-width:62px}
@media (max-width:760px){.dcSum{display:none}#abar{width:96%}}
.zone{cursor:pointer}
.zc{fill:#54707c;stroke:#2c3b42;stroke-width:1.5;opacity:.92}
.zone.zsel .zc{stroke:#fffbe8;stroke-width:3}
.zone.ztgt .zc{stroke:var(--gold);stroke-width:3;stroke-dasharray:6 4}
.zn{font-size:11px;fill:#41575f;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#b6c2b6;stroke-width:2px}
@media (max-width:760px){
  #rail{width:46px;padding:6px 3px}
  .rbtn .rlb{display:none}
  .rbtn .ric{font-size:20px}
  #drawer{top:auto;left:0;right:0;bottom:0;width:100%;max-width:100%;max-height:62%;border-left:none;border-top:1px solid var(--gold);border-radius:10px 10px 0 0;transform:translateY(105%)}
  #drawer.open{transform:translateY(0)}
  #drawer.open~#abar{display:none!important}
  #mapwrap.drawered #zoomctl{right:12px;bottom:calc(72% + 10px)}   /* bottom sheet on phones: lift the controls above it */
  #drawer{max-height:72%}                    /* a building list needs more than 62% of a phone screen */
  #abar{max-height:60%;width:98%;bottom:6px;padding:8px}
  .rbtn .rlb{display:block;font-size:8.5px;line-height:1.1;text-align:center}   /* icon-only rail left every button a guess */
  .rbtn .ric{font-size:17px}
  #rail{width:58px}
  #logdrawer{width:86%}
  #hdr{gap:8px;padding:6px 8px}
  #hdr .title{display:none}
  button{padding:8px 12px}
  .buildrow button{padding:6px 14px}
}
</style>
</head>
<body>

<div id="start">
  <div class="inner">
    <h1>AGE OF CROWNS</h1>
    <div class="sub">A medieval game of world conquest &mdash; hold 60% of all provinces to win</div>
    <h2>Choose your empire</h2>
    <div class="empgrid" id="empgrid"></div>
    <h2>Choose your rivals (2 to 5)</h2>
    <div class="rivalrow" id="rivalrow"></div>
    <h2>Choose difficulty</h2>
    <div class="rivalrow" id="diffrow"></div>
    <button id="startBtn" class="primary">Begin the conquest</button>
    <div><button id="contBtn">Continue saved game</button></div>
    <div id="impWrap"><textarea id="impT" placeholder="Paste a save code from another device..."></textarea><button id="impBtn">Import save code</button><div id="impMsg"></div></div>
    <div id="startMsg">Select an empire and 2 to 5 rivals.</div>
  </div>
</div>

<div id="game">
  <div id="hdr">
    <span class="title">AGE OF CROWNS</span>
    <span class="empbadge"><span class="dot" id="hEmpDot"></span><span id="hEmpName"></span></span>
    <span class="stat">Gold: <b id="hGold">0</b> (<span id="hInc">+0</span>/turn)</span>
    <span class="stat">Cities: <b id="hProv">0</b>/80 (need 48)</span>
    <span class="stat">Turn <b id="hTurn">1</b></span>
    <span class="right"><button id="endTurn" class="primary">End turn</button></span>
  </div>
  <div id="main">
    <div id="rail">
      <button class="rbtn" onclick="toggleRail()" title="Collapse/expand this bar"><span class="ric">&#9776;</span><span class="rlb">Menu</span></button>
      <button class="rbtn" onclick="showCityList()" title="Your cities"><span class="ric">&#127984;</span><span class="rlb">Cities</span></button>
      <button class="rbtn" onclick="showDiplomacy()" title="Diplomacy"><span class="ric">&#9873;</span><span class="rlb">Diplomacy</span></button>
      <button class="rbtn" onclick="showStandings()" title="Standings"><span class="ric">&#9818;</span><span class="rlb">Standings</span></button>
      <button class="rbtn" id="techBtn" title="Research"><span class="ric">&#9879;</span><span class="rlb">Research</span></button>
      <button class="rbtn" id="unitsBtn" title="Units"><span class="ric">&#9876;</span><span class="rlb">Units</span></button>
      <button class="rbtn" id="logBtn" title="Chronicle"><span class="ric">&#128220;</span><span class="rlb">Chronicle</span><span id="logBadge"></span></button>
      <button class="rbtn" id="expBtn" title="Save code"><span class="ric">&#128190;</span><span class="rlb">Save</span></button>
      <button class="rbtn" id="animBtn" title="Turn marching animations on or off"><span class="ric">&#10227;</span><span class="rlb">Motion: on</span></button>
      <button class="rbtn" id="tiltBtn" title="Toggle 3D tilt"><span class="ric">&#128444;</span><span class="rlb">Tilt: on</span></button>
      <button class="rbtn" id="helpBtn" title="How to play"><span class="ric">?</span><span class="rlb">Help</span></button>
    </div>
    <div id="mapwrap" class="tilted">
      <div id="tiltbox"><svg id="map" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div id="zoomctl">
        <button id="zin">+</button>
        <button id="zout">&minus;</button>
        <button id="zfit" title="Fit world">&#8962;</button>
      </div>
      <div id="drawer">
        <div id="dHead"><span id="dTitle"></span><button id="dClose" onclick="closeDrawer(true)">&times;</button></div>
        <div id="panel"></div>
      </div>
      <div id="abar"></div>
      <div id="logdrawer">
        <div id="dHead2"><h3>Chronicle</h3><button onclick="toggleLog(false)">&times;</button></div>
        <div id="log"></div>
      </div>
    </div>
  </div>
</div>

<div id="modal"><div class="box"><h3 id="mTitle"></h3><div class="body" id="mBody"></div><div class="btns" id="mBtns"></div></div></div>

// ================= damage-pool combat (v5 pass 3a) =================
// dmgOutput: total damage a force deals against an enemy composition.
function dmgOutput(force,enemy,owner,mode){
  const te=Math.max(1,cnt(enemy));let s=0;
  for(const t in force){
    if(!force[t])continue;
    const ranged=UNITS[t].ranged;
    if(mode==='ranged'&&!ranged)continue;
    if(mode==='melee'&&ranged)continue;
    let m=1;
    for(const u in enemy){
      if(!enemy[u])continue;
      const sh=enemy[u]/te;
      if(beatsUnit(t,u))m+=0.5*sh;
      if(beatsUnit(u,t))m-=0.25*sh;
    }
    s+=force[t]*UNITS[t].dmg*m*techMult(owner,t);
  }
  return Math.max(0,s);
}
// pool: total remaining hit points of an army {u,d}
function poolOf(army){
  let s=0;
  for(const t in army.u)s+=army.u[t]*UNITS[t].hp;
  if(army.d)for(const t in army.d)if(army.u[t])s-=Math.min(army.d[t],army.u[t]*UNITS[t].hp);
  return Math.max(0,s);
}
// applyDamage: spread raw damage across the stack; flat armor reduces each unit's share
// (minimum 30% chips through so armor never makes a unit invincible). Wounds persist in army.d.
function applyDamage(army,raw){
  const kills={};
  const tot=cnt(army.u);
  if(!tot||raw<=0)return kills;
  army.d=army.d||{};
  for(const t of Object.keys(army.u)){
    const n=army.u[t];if(!n)continue;
    const share=raw*(n/tot);
    const perUnit=share/n;
    const eff=Math.max(perUnit*0.3,perUnit-UNITS[t].armor);
    let dmg=eff*n+(army.d[t]||0);
    let dead=Math.min(Math.floor(dmg/UNITS[t].hp),n);
    army.u[t]-=dead;
    army.d[t]=dmg-dead*UNITS[t].hp;
    if(army.u[t]<=0){delete army.u[t];delete army.d[t];}
    if(dead)kills[t]=dead;
  }
  return kills;
}
const sumKills=k=>{let s=0;for(const t in k)s+=k[t];return s;};
// strength: heuristic proxy for AI decisions and odds (damage-weighted, counter-aware)
function strength(a,e,isDef,isCap,owner){
  const s=dmgOutput(a,e,owner,'all');
  let m=1;
  if(isDef)m*=1.5;   // defending your own city: 1.2 base + 25% garrison protection
  if(isCap)m*=1.15;
  return s*m;
}

function removeUnits(a,n){
  const lost={};
  for(let i=0;i<n;i++){
    const tot=cnt(a);if(tot<=0)break;
    let r=Math.random()*tot;
    for(const t in a){
      if(!a[t])continue;
      r-=a[t];
      if(r<0){a[t]--;lost[t]=(lost[t]||0)+1;break;}
    }
  }
  return lost;
}

// ================= pass 5a: fleets roam the sea mesh =================
// A fleet is an entity on a sea cell, exactly as an army is an entity on a land cell:
// {e:empire, n:galleys, mv:cells used this turn, load:{unit:count} or null}.
// The old model was a bag of counts per sea zone, which could not express position.
const SHIP_SPEED=4;                 // cells per turn; Admiralty (sea tech 3) adds two
const SHIP_CAPACITY=3;              // troops each galley can carry
function shipSpeed(e){return SHIP_SPEED+(techLvOf(e,'sea')>=3?2:0);}
function navyAt(sid){return (G.navy&&G.navy[sid])||null;}
function naviesOf(e){const o=[];for(const s in (G.navy||{}))if(G.navy[s].e===e)o.push(s);return o;}
function fleetRange(f){return Math.max(0,shipSpeed(f.e)-(f.mv||0));}
function loadCount(f){return f&&f.load?cnt(f.load):0;}
function loadRoom(f){return f.n*SHIP_CAPACITY-loadCount(f);}
function enemyNavyAt(sid,e){const f=navyAt(sid);return (f&&f.e!==e&&hostileTo(e,f.e))?f.e:null;}
function seaBlocked(sid,e){return !!enemyNavyAt(sid,e);}
function addNavy(sid,e,n,moved){
  const f=navyAt(sid);
  if(f&&f.e===e){f.n+=n;if(moved)f.mv=shipSpeed(e);return f;}
  G.navy=G.navy||{};
  G.navy[sid]={e,n,mv:moved?shipSpeed(e):0,load:null};
  return G.navy[sid];
}
// reachable sea cells within range; a hostile fleet is a target you may strike but not sail through
function seaMap(fromSid,e,range){
  const dist={};dist[fromSid]=0;const parent={};
  const q=[fromSid];
  while(q.length){
    const cur=q.shift(); const d=dist[cur];
    if(d>=range)continue;
    for(const nk of (SADJ[cur]||[])){
      if(nk in dist)continue;
      dist[nk]=d+1;parent[nk]=cur;
      if(!seaBlocked(nk,e))q.push(nk);
    }
  }
  return {dist,parent};
}
function seaPath(fromSid,toSid,parent){
  const out=[toSid];let c=toSid,guard=0;
  while(c!==fromSid&&guard++<200){c=parent[c];if(c===undefined)return null;out.unshift(c);}
  return out;
}
function mergeLoad(dst,src){
  if(!src.load)return;
  dst.load=dst.load||{};
  for(const t in src.load)dst.load[t]=(dst.load[t]||0)+src.load[t];
}
function moveNavy(from,to,e){
  const f=navyAt(from);
  if(!f||f.e!==e||from===to)return 0;
  const mm=seaMap(from,e,fleetRange(f));
  if(!(to in mm.dist))return 0;
  const cost=mm.dist[to];
  const tgt=navyAt(to);
  if(tgt&&tgt.e!==e)return 0;                      // strike it with navalClash instead
  f.mv=(f.mv||0)+cost;
  const path=seaPath(from,to,mm.parent)||[from,to];
  for(let i=0;i+1<path.length;i++)G.animQ.push({from:path[i],to:path[i+1],e,t:'ship',sea:1});
  if(tgt){tgt.n+=f.n;tgt.mv=Math.max(tgt.mv||0,f.mv);mergeLoad(tgt,f);}
  else G.navy[to]=f;
  delete G.navy[from];
  return cost;
}
// A destination beyond this turn's sail is not a dead end: the fleet goes as far as it can and
// keeps going on its own each turn, the way armies already take standing march orders.
function seaFullPath(from,to,e){
  const dist={};dist[from]=0;const parent={};
  const q=[from];
  while(q.length){
    const cur=q.shift();
    if(cur===to)return seaPath(from,to,parent);
    for(const nk of (SADJ[cur]||[])){
      if(nk in dist)continue;
      dist[nk]=dist[cur]+1;parent[nk]=cur;
      if(nk===to)return seaPath(from,to,parent);
      if(!seaBlocked(nk,e))q.push(nk);
    }
  }
  return null;
}
function sailToward(from,to,e){
  const f=navyAt(from);
  if(!f||f.e!==e)return null;
  const path=seaFullPath(from,to,e);
  if(!path||path.length<2)return null;
  const reach=fleetRange(f);
  let step=from;
  for(let i=1;i<path.length&&i<=reach;i++){
    if(navyAt(path[i])&&navyAt(path[i]).e!==e)break;    // never barge into a hostile fleet
    step=path[i];
  }
  if(step===from)return {moved:0,at:from,left:path.length-1};
  moveNavy(from,step,e);
  const fl=navyAt(step);
  const rest=(step===to)?null:seaFullPath(step,to,e);
  if(fl){
    if(step===to)delete fl.ord; else fl.ord=to;
  }
  return {moved:1,at:step,left:rest?rest.length-1:0};
}
function advanceNavyOrders(e){
  naviesOf(e).forEach(sid=>{
    const f=G.navy[sid];
    if(!f||!f.ord||f.ord===sid)return;
    const dest=f.ord;
    if(!SEA[dest]){delete f.ord;return;}
    const r=sailToward(sid,dest,e);
    if(!r||!r.moved){                       // boxed in by an enemy fleet — drop the order rather than loop
      const still=navyAt(sid);
      if(still)delete still.ord;
    }
  });
}
function navalClash(from,to,e){
  const a=navyAt(from),d=navyAt(to);
  if(!a||!d||a.e!==e)return null;
  const mm=seaMap(from,e,fleetRange(a));
  if(!(to in mm.dist))return null;
  a.mv=shipSpeed(e);
  const Sa=a.n*(1+0.12*techLvOf(e,'sea'))*rand(0.85,1.15);
  const Sd=d.n*(1+0.12*techLvOf(d.e,'sea'))*rand(0.85,1.15);
  const rep={att:e,def:d.e,a:a.n,d:d.n,win:false,attLost:0,defLost:0,sid:to};
  if(Sa>Sd){
    const lost=Math.min(Math.round(a.n*0.5*Sd/Sa),a.n-1);
    rep.win=true;rep.attLost=lost;rep.defLost=d.n;
    a.n-=lost;
    delete G.navy[to];                             // drowned crews take their cargo down with them
    G.navy[to]=a;delete G.navy[from];
  }else{
    const dl=Math.min(Math.round(d.n*0.5*Sa/Sd),d.n-1);
    rep.attLost=a.n;rep.defLost=dl;
    d.n-=dl;delete G.navy[from];
  }
  return rep;
}
// ---- ports, embarking, landing ----
function portCellsFree(pid,e){
  return (PORTS[pid]||[]).filter(sid=>{const f=navyAt(sid);return !f||f.e===e;});
}
function shoreLandCells(sid,e){
  return (SCOAST[sid]||[]).filter(cid=>{
    if(sealedBorder(cid,e))return false;
    const other=G.armies[cid];
    return !(other&&other.e!==e);
  });
}
function embarkableAt(sid,e){          // your armies standing on a shore this fleet touches
  return (SCOAST[sid]||[]).filter(cid=>{const a=G.armies[cid];return a&&a.e===e&&cnt(a.u)>0;});
}
function doEmbark(sid,cid){
  const f=navyAt(sid),a=G.armies[cid];
  if(!f||!a||f.e!==a.e)return false;
  const room=loadRoom(f);
  if(room<=0)return false;
  f.load=f.load||{};
  let taken=0;
  for(const t in a.u){
    while(a.u[t]>0&&taken<room){a.u[t]--;f.load[t]=(f.load[t]||0)+1;taken++;}
    if(!a.u[t])delete a.u[t];
    if(taken>=room)break;
  }
  if(!cnt(a.u))delete G.armies[cid];
  return taken;
}
function doLand(sid,cid){
  const f=navyAt(sid);
  if(!f||!f.load||!cnt(f.load))return false;
  const ex=G.armies[cid];
  if(ex&&ex.e!==f.e)return false;
  if(ex){for(const t in f.load)ex.u[t]=(ex.u[t]||0)+f.load[t];ex.mv=shipSpeed(f.e);}
  else G.armies[cid]={e:f.e,u:Object.assign({},f.load),mv:99,w:0};   // no marching the turn it lands
  if(cellOwnerOf(cid)==='neutral'||cellOwnerOf(cid)===f.e)G.cellOwner[cid]=f.e;
  const n=cnt(f.load);
  f.load=null;
  return n;
}

const RESEARCH_PER_TURN=2;
function researchesLeft(){return RESEARCH_PER_TURN-((G&&G.res)||0);}
function researchTech(empKey,tr){
  const e=G.emp[empKey];
  if(!e||!e.tech)return false;
  const lv=e.tech[tr]||0;
  if(lv>=3)return false;
  if(empKey===G.player){
    if(researchesLeft()<=0)return false;
  }else if(e.lastResearch===G.turn)return false;
  const cost=TECH[tr].lv[lv].c;
  if(e.gold<cost)return false;
  e.gold-=cost;
  e.tech[tr]=lv+1;
  e.lastResearch=G.turn;
  if(empKey===G.player)G.res=(G.res||0)+1;
  return true;
}

// ================= V5 CORE: cells, armies, provinces =================
let G=null;
const NEED5=48;
const SPD5={spear:3,sword:3,longbow:3,crossbow:3,cavalry:5,catapult:2};
function spdOf(owner,t){
  const tk=trackOf(t);
  if(tk==='cavalry'&&techLvOf(owner,'horse')>=3)return SPD5.cavalry+1;
  return SPD5[tk]||3;
}
const BASE2EMP={};
for(const k in EMPIRES)BASE2EMP[EMPIRES[k].cap.replace(/\d+$/,'')]=k;
function homeEmpOf(pv){return pv.home?BASE2EMP[pv.home]||null:null;}
function cellOf(id){return MAPD5.cells[id];}
function provOf(pid){return MAPD5.provs[pid];}
function cellOwnerOf(cid){return (G.cellOwner&&G.cellOwner[cid])||'neutral';}
function ownerOf(pid){return cellOwnerOf(provOf(pid).citycell);}        // a city belongs to whoever holds its city cell
function provsOf(e){return Object.keys(MAPD5.provs).filter(p=>ownerOf(p)===e);}  // cities held
function cellsOf(e){let n=[];for(const c in G.cellOwner)if(G.cellOwner[c]===e)n.push(c);return n;}
function occupiedCell(cid){const o=cellOwnerOf(cid);return o!=='neutral'&&homeEmpOf(provOf(cellOf(cid).p))!==o;}
function armiesOf(e){return Object.keys(G.armies).filter(c=>G.armies[c].e===e);}
// ================= diplomacy (pass 4b) =================
const TRUCE_TURNS=5;                    // after peace, neither side may declare for this long
function dipKey(a,b){return a<b?a+'|'+b:b+'|'+a;}
function dipOf(a,b){
  if(a===b||a==='neutral'||b==='neutral')return null;   // free lords have no diplomacy — always fair game
  G.dip=G.dip||{};
  const k=dipKey(a,b);
  if(!G.dip[k])G.dip[k]={state:'peace',rel:0,truce:0,since:G.turn};
  return G.dip[k];
}
function atWar(a,b){const d=dipOf(a,b);return !!d&&d.state==='war';}
function hostileTo(e,other){return other==='neutral'||other===null||atWar(e,other);}  // who you may attack
function truceLeft(a,b){const d=dipOf(a,b);return d?d.truce:0;}
function relOf(a,b){const d=dipOf(a,b);return d?d.rel:0;}
function relLabel(r){
  if(r>=35)return {t:'cordial',c:'#7ec97e'};
  if(r>=10)return {t:'amicable',c:'#a8c98a'};
  if(r>-10)return {t:'neutral',c:'#c9a227'};
  if(r>-35)return {t:'strained',c:'#e08a3c'};
  return {t:'hostile',c:'#c94040'};
}
function declareWar(a,b,quiet){
  const d=dipOf(a,b);
  if(!d||d.state==='war')return false;
  if(d.truce>0)return false;
  d.state='war';d.since=G.turn;d.rel=Math.min(d.rel,-40);
  for(const k in G.emp){          // the world remembers a warmonger
    if(k===a||k===b||!G.emp[k].alive)continue;
    const o=dipOf(a,k);
    if(o)o.rel-=15;
  }
  if(!quiet)log('<b>'+empName(a)+'</b> declares war on <b>'+empName(b)+'</b>!','turnmark');
  return true;
}
function makePeace(a,b,quiet){
  const d=dipOf(a,b);
  if(!d||d.state!=='war')return false;
  d.state='peace';d.truce=TRUCE_TURNS;d.rel=Math.max(d.rel,-5);d.since=G.turn;
  if(!quiet)log('<b>'+empName(a)+'</b> and <b>'+empName(b)+'</b> agree to peace — a '+TRUCE_TURNS+'-turn truce holds.','turnmark');
  return true;
}
function tickDiplomacy(){
  G.dip=G.dip||{};
  for(const k in G.dip){
    const d=G.dip[k];
    if(d.truce>0)d.truce--;
    if(d.state==='peace'&&d.rel<50)d.rel+=1;      // memories fade in peacetime
  }
}
// how strong an empire looks (cities + troops), for AI war/peace decisions
function powerOf(e){
  let troops=0;
  armiesOf(e).forEach(c=>{troops+=cnt(G.armies[c].u);});
  return provsOf(e).length*3+troops;
}
function bordersWith(a,b){

  const cap=RECRUIT_CAP+2*bldLv(pid,'granary');
  if(recruitedThisTurn(pid)>=cap){toast('This city has already mustered '+cap+' recruits this turn.');return;}
  G.rec[pid]=(G.rec[pid]||0)+1;
  e.gold-=UNITS[t].cost;
  G.train=G.train||{};
  G.train[pid]=G.train[pid]||[];
  G.train[pid].push({t,left:trainTurns(t)});
  renderHdr();
  openCityPanel(pid);
}
function cancelTrain(pid,i){                            // refund half when you change your mind
  const q=queueOf(pid);
  if(!q[i])return;
  const u=UNITS[q[i].t];
  G.emp[G.player].gold+=Math.floor(u.cost/2);
  q.splice(i,1);
  renderHdr();openCityPanel(pid);saveGame();
}
function processTraining(empKey){
  G.train=G.train||{};
  for(const pid in G.train){
    if(ownerOf(pid)!==empKey)continue;
    const q=G.train[pid];
    const done={};
    for(let i=q.length-1;i>=0;i--){
      q[i].left--;
      if(q[i].left<=0){done[q[i].t]=(done[q[i].t]||0)+1;q.splice(i,1);}
    }
    if(cnt(done)){
      placeArmy(provOf(pid).citycell,empKey,done,99,false);
      if(empKey===G.player)log(cnt(done)+' fresh troop'+(cnt(done)>1?'s':'')+' muster in <b>'+provOf(pid).city+'</b>.','');
    }
    if(!q.length)delete G.train[pid];
  }
}
// ---- neutral cities defend themselves (free lords raise troops and fortify) ----
function growNeutrals(){
  G.bld=G.bld||{};
  for(const pid in MAPD5.provs){
    if(ownerOf(pid)!=='neutral')continue;
    const cc=provOf(pid).citycell;
    const gar=G.armies[cc];
    const rich=provOf(pid).inc>=10;
    const capTroops=rich?14:10;
    if(Math.random()<(rich?0.5:0.35)){
      const t=pick(['militia','levy','shortbow','handxbow']);
      if(!gar)G.armies[cc]={e:'neutral',u:{[t]:1},mv:0,w:0};
      else if(cnt(gar.u)<capTroops)gar.u[t]=(gar.u[t]||0)+1;
    }
    if(G.turn>8&&Math.random()<0.05&&bldLv(pid,'walls')<2){   // they raise walls over time
      G.bld[pid]=G.bld[pid]||{};
      G.bld[pid].walls=(G.bld[pid].walls||0)+1;
    }
  }
}

function advanceOrders(e){
  const starts=armiesOf(e);
  for(const startCid of starts){
    let cur=startCid;
    let live=G.armies[cur];
    if(!live||!live.ord||live.e!==e)continue;
    const rng=forceRange(live,live.u);
    let steps=0;
    while(steps<rng){
      live=G.armies[cur];
      if(!live||!live.ord){break;}
      const dest=live.ord;
      const path=fullPathTo(cur,dest,e);
      if(!path||path.length<2){delete live.ord;break;}
      const nxt=path[1];
      const cell=cellOf(nxt);
      if(isBlockedCell(nxt,e)){ // enemy/neutral army (incl. a garrisoned city) blocks the step
        if(nxt===dest)delete live.ord;  // arrived adjacent to the target — clear order, let player assault
        break;
      }
      // (undefended foreign cities are allowed: placeArmy captures them on entry)
      const force=takeForce5(cur,live.u);
      if(!cnt(force))break;
      if(G.animQ)G.animQ.push({from:cur,to:nxt,e,t:domType(force)});
      const baseMv=G.armies[nxt]?G.armies[nxt].mv:0;
      placeArmy(nxt,e,force,baseMv+1,false,G._takenD);
      const moved=G.armies[nxt];
      if(!moved)break;
      if(nxt===dest){delete moved.ord;break;}
      moved.ord=dest;
      cur=nxt;steps++;
    }
  }
}
function orderEtaTurns(cid){
  const a=G.armies[cid];
  if(!a||!a.ord)return null;
  const path=fullPathTo(cid,a.ord,a.e);
  if(!path)return null;
  const remaining=path.length-1;
  const rng=Math.max(1,forceRange(a,a.u));
  return Math.max(1,Math.ceil(remaining/rng));
}

function layStartSiege(fromCell,cityCell,want,e){
  // move the force to the cell adjacent to the city, claim the approach, then dig in
  const info=marchTargets5(fromCell,want,false);
  if(!info.targets[cityCell])return false;
  const path=marchPath5(fromCell,cityCell,info.parent);   // [...,adjCell,cityCell]
  if(!path||path.length<2)return false;
  const adj=path[path.length-2];
  const force=takeForce5(fromCell,want);
  if(!cnt(force))return false;
  const sdmap=G._takenD;
  for(let i=0;i<path.length-1;i++){                         // sweep-capture the approach cells
    if(G.animQ&&i<path.length-2)G.animQ.push({from:path[i],to:path[i+1],e,t:domType(force)});
    if(path[i]!==cityCell)claimCell(path[i],e);
  }
  placeArmy(adj,e,force,99,false,sdmap);
  const army=G.armies[adj];
  if(army)army.siege=cityCell;
  log(empName(e)+' lays siege to <b>'+provOf(cellOf(cityCell).p).city+'</b>.','');
  return true;
}
function liftSiege(cellId){ const a=G.armies[cellId]; if(a){delete a.siege;a.mv=0;} }
function resolveSieges(e){
  for(const cid of armiesOf(e)){
    const a=G.armies[cid];
    if(!a.siege)continue;
    const cityCell=a.siege;
    if(!CADJ[cid].includes(cityCell)||cellOwnerOf(cityCell)===e){delete a.siege;continue;}
    if(!hostileTo(e,cellOwnerOf(cityCell))){        // peace was signed — the siege lifts
      delete a.siege;
      if(e===G.player)log('Your siege of <b>'+provOf(cellOf(cityCell).p).city+'</b> lifts with the peace.','');
      continue;
    }
    const gar=G.armies[cityCell];
    const pid5=cellOf(cityCell).p;
    const cityName=provOf(pid5).city;
    if(gar&&cnt(gar.u)){
      const rate=SIEGE_ATTR[Math.min(bldLv(pid5,'walls'),SIEGE_ATTR.length-1)];   // walls slow the starvation
      const loss=Math.max(1,Math.ceil(cnt(gar.u)*rate));
      removeUnits(gar.u,loss);
      log(empName(e)+"'s siege grinds down <b>"+cityName+'</b> ('+loss+' lost, '+cnt(gar.u)+' hold out'+(bldLv(pid5,'walls')?', walls hold':'')+').','');
    }
    const g2=G.armies[cityCell];
    if(!g2||!cnt(g2.u)){                    // garrison broken -> besiegers storm in and take the city
      if(g2)delete G.armies[cityCell];
      const force=takeForce5(cid,a.u);
      if(G.animQ)G.animQ.push({from:cid,to:cityCell,e,t:domType(force)});
      placeArmy(cityCell,e,force,99,false,G._takenD);
      if(bldLv(pid5,'walls')>0){            // a starved city falls hard: its walls lose a level
        G.bld[pid5].walls--;
        log('The walls of <b>'+cityName+'</b> are torn down a level in the sack.','');
      }
      log(empName(e)+' storms the starved gates of <b>'+cityName+'</b>.','');
    }
  }
}

// ================= V5 AI =================
const PERS={
 agg:{thr:1.12,reserve:10,mix:{cavalry:3,sword:3,spear:2,crossbow:1,longbow:1,catapult:1}},
 bld:{thr:1.45,reserve:30,mix:{spear:2,sword:2,longbow:2,crossbow:2,cavalry:1,catapult:2}},
 opp:{thr:1.28,reserve:15,mix:{sword:2,cavalry:2,spear:2,longbow:1,crossbow:2,catapult:1}}
};
function pickWeighted(mix,maxCost){
  const opts=UKEYS.filter(t=>UNITS[t].cost<=maxCost);
  if(!opts.length)return null;
  let tot=0;opts.forEach(t=>tot+=(mix[t]||0));
  if(tot<=0)return pick(opts);
  let r=Math.random()*tot;
  for(const t of opts){r-=(mix[t]||0);if(r<0)return t;}
  return opts[0];
}
function nearestTargetCity(fromCell,e,maxD){
  const dist={};dist[fromCell]=0;
  const parent={};
  const q=[fromCell];
  let found=null;
  while(q.length){
    const cur=q.shift();
    const d=dist[cur];
    if(d>=maxD)continue;
    for(const nk of CADJ[cur]){
      if(nk in dist)continue;
      dist[nk]=d+1;parent[nk]=cur;
      const cell=cellOf(nk);
      if(sealedBorder(nk,e))continue;                  // treaties bar the AI too
      const foreignCity=cell.city&&ownerOf(cell.p)!==e;
      const blocked=isBlockedCell(nk,e);
      if(foreignCity||blocked){
        if(foreignCity&&mayAttackCell(nk,e)&&(!found||d+1<found.d)){
          const gar=G.armies[nk];
          found={cell:nk,d:d+1,pid:cell.p,gar:gar?cnt(gar.u):0,owner:ownerOf(cell.p),parent,dist};
        }
        continue;
      }
      q.push(nk);
    }
  }
  return found;
}
function aiArmyAct(k,cid,want,P,D){
  const tgt=nearestTargetCity(cid,k,7);
  if(!tgt)return false;
  if(ownerOf(tgt.pid)===G.player&&G.turn<=D.grace)return false;
  const army=G.armies[cid];
  const info=marchTargets5(cid,want,false);
  let dest=null;
  if(info.targets[tgt.cell]){
    const gar=G.armies[tgt.cell];
    const Sa=strength(want,gar?gar.u:{},false,false,k);
    const Sd=Math.max(strength(gar?gar.u:{},want,true,!!provOf(tgt.pid).cap,gar?gar.e:'neutral'),0.2);
    if(!gar||Sa/Sd>P.thr+D.thr)dest=tgt.cell;
  }
  if(!dest){
    const rng=forceRange(army,want);
    const path=marchPath5(cid,tgt.cell,tgt.parent);
    if(path)for(let i=Math.min(rng,path.length-2);i>=1;i--){
      const step=path[i];
      if(info.targets[step]&&(!G.armies[step]||G.armies[step].e===k)){dest=step;break;}
    }
  }
  if(dest&&dest!==cid){
    const r=executeMarch(cid,dest,want,false,k);
    if(r&&r.type==='battle')logBattle5(r.rep);
    return true;
  }
  // couldn't win an assault this turn: if adjacent to the target city with a real force, dig in and besiege
  if(info.targets[tgt.cell]&&CADJ[cid].includes(tgt.cell)&&cnt(want)>=4&&Math.random()<0.6){
    layStartSiege(cid,tgt.cell,want,k);
    return true;
  }
  return false;
}
// ---- diplomacy brain (pass 4b) ----
const WARLUST={agg:1.0,opp:0.6,bld:0.3};      // how readily each personality reaches for the sword
function aiDiplomacy(k){
  const e=G.emp[k];
  const D=DIFFS[G.diff||'norm'];
  const mine=powerOf(k);
  for(const o in G.emp){
    if(o===k||!G.emp[o].alive)continue;
    const d=dipOf(k,o);
    if(!d)continue;
    const theirs=Math.max(1,powerOf(o));
    if(d.state==='war'){
      // sue for peace when the war is going badly or dragging on
      const losing=mine<theirs*0.7;
      const dragging=G.turn-d.since>15;
      if((losing&&Math.random()<0.25)||(dragging&&Math.random()<0.12)){
        if(o===G.player){
          if(makePeace(k,o,true))log('<b>'+empName(k)+'</b> sues for peace with you — a '+TRUCE_TURNS+'-turn truce holds.','turnmark');
        }else makePeace(k,o,true);
      }
      continue;
    }
    if(d.truce>0)continue;
    if(G.turn<=D.grace&&o===G.player)continue;          // difficulty grace protects the player early
    if(G.turn<4)continue;
    // appetite: strong, aggressive, bordering neighbours with poor relations get declared on
    let want=WARLUST[e.pers]||0.5;
    want*=mine/(mine+theirs);                            // only bully when comfortably ahead
    if(bordersWith(k,o))want*=1.8; else want*=0.25;
    if(d.rel<-20)want*=1.6; else if(d.rel>25)want*=0.4;
    if(provsOf(o).length<=2)want*=1.5;                   // finish off the weak
    want*=(D.thr?1:1);
    if(Math.random()<want*0.10){
      declareWar(k,o);
      if(o===G.player)log('<b style="color:var(--danger)">'+empName(k)+' has declared war on you!</b>','turnmark');
      break;                                             // at most one new war per turn
    }
  }
}
function aiTurn(k){
  const e=G.emp[k];
  if(!e.alive||G.over)return;
  const P=PERS[e.pers];
  const D=DIFFS[G.diff||'norm'];
  aiDiplomacy(k);
  resolveSieges(k);
  healArmies(k);
  processBuilds(k);
  processTraining(k);
  tickOccupation(k);
  armiesOf(k).forEach(c=>{if(G.armies[c])G.armies[c].w=0,G.armies[c].mv=0;});
  e.gold+=Math.round(incomeOf(k)*D.inc);
  const reserve=P.reserve+D.res;
  const prefs={agg:['blades','horse','siege','fletch','sea'],bld:['fletch','siege','blades','sea','horse'],opp:['horse','blades','fletch','sea','siege']}[e.pers];
  if(e.tech&&e.lastResearch!==G.turn){
    for(const tr of prefs){
      const lv=e.tech[tr]||0;
      if(lv>=3)continue;
      if(e.gold>=TECH[tr].lv[lv].c+reserve+20){researchTech(k,tr);break;}
    }
  }
  const myProvs=provsOf(k);
  // build: up to 2 cities without a project start a useful upgrade
  let built=0;
  // pass 4e: absorb settled conquests so the AI is not stuck mustering militia from half its empire.
  // Annexation gets its own budget of one city per turn — sharing the build allowance meant an AI that
  // annexed simply stopped constructing, and the annexed cities never grew the buildings that justify them.
  let annexedThisTurn=0;
  for(const pid of myProvs){
    if(annexedThisTurn>=1)break;
    if(canBuildIn(pid,k)||!canAnnex(pid,k))continue;
    if(G.buildQ&&G.buildQ[pid])continue;
    const ac=annexCost(pid);
    if(e.gold>=ac+reserve+40&&Math.random()<0.5&&startAnnex(pid,k))annexedThisTurn++;
  }
  for(const pid of myProvs){
    if(built>=2)break;
    if(!canBuildIn(pid,k))continue;              // homeland only, same rule as the player
    if(G.buildQ&&G.buildQ[pid])continue;
    if(Math.random()>0.45)continue;
    const prefs2=e.pers==='bld'?['market','walls','barracks','range','stables','workshop','granary']
                :e.pers==='agg'?['stables','barracks','workshop','range','walls','market','granary']
                :['barracks','range','market','stables','walls','workshop','granary'];
    for(const b of prefs2){
      const lv=bldLv(pid,b);
      if(lv>=BLD[b].max)continue;
      const cost=BLD[b].cost[lv];
      if(e.gold>=cost+reserve+30){if(startBuild(pid,b,k)){built++;}break;}
    }
  }
  let budget=Math.max(0,Math.round((e.gold-reserve)*D.spend));
  let guard=0;
  while(budget>=7&&e.gold>=7&&myProvs.length&&guard++<60){
    let t=pickWeighted(P.mix,Math.min(budget,e.gold));
    if(!t)break;
    const pid=pick(myProvs);
    // best tier this CITY can actually train (building-gated), affordable
    const tk=trackOf(t);
    const options=UKEYS.filter(x=>UNITS[x].track===tk&&canRecruit(pid,x)&&UNITS[x].cost<=Math.min(budget,e.gold))
      .sort((a,b)=>UNITS[b].tier-UNITS[a].tier);
    if(options.length)t=options[0];
    else{                                  // this track is gated here — fall back to any tier-1 it can train
      const any=UKEYS.filter(x=>UNITS[x].tier===1&&canRecruit(pid,x)&&UNITS[x].cost<=Math.min(budget,e.gold));
      if(!any.length){budget-=5;continue;}
      t=pick(any);
    }
    e.gold-=UNITS[t].cost;budget-=UNITS[t].cost;
    G.train=G.train||{};                          // AI trains over time too
    G.train[pid]=G.train[pid]||[];
    G.train[pid].push({t,left:trainTurns(t)});
  }
  // Pass 5a keeps AI navies deliberately simple: raise a few galleys, strike an adjacent
  // enemy fleet when clearly stronger, otherwise hold station. Roaming navies are pass 5c,
  // and half-building them here would only be thrown away.
  naviesOf(k).forEach(sid=>{G.navy[sid].mv=0;});
  advanceNavyOrders(k);
  const ports=myProvs.filter(pid=>isPort(pid));
  let myFleet=0;naviesOf(k).forEach(sid=>{myFleet+=G.navy[sid].n;});
  if(ports.length&&e.gold>=SHIP.cost+20&&myFleet<4&&Math.random()<0.5){
    const pid=pick(ports);
    const free=portCellsFree(pid,k);
    if(free.length){e.gold-=SHIP.cost;addNavy(free[0],k,1,true);}
  }
  naviesOf(k).forEach(sid=>{
    if(G.over)return;
    const f=G.navy[sid];
    if(!f||f.e!==k)return;
    for(const n of (SADJ[sid]||[])){
      const foe=navyAt(n);
      if(!foe||foe.e===k||!hostileTo(k,foe.e))continue;
      if(f.n<foe.n*1.3)continue;
      const rep=navalClash(sid,n,k);
      if(rep)log(empName(k)+(rep.win?' swept ':' was repelled by ')+empName(rep.def)+"'s galleys at sea.");
      break;
    }
  });
  const list=armiesOf(k);
  const acted=new Set();
  list.forEach(cid=>{
    if(G.over||acted.has(cid))return;
    const army=G.armies[cid];
    if(!army||army.e!==k)return;
    if(army.siege)return;            // an AI besieger stays committed; resolveSieges finishes the job
    const here=cellOf(cid);
    const total=cnt(army.u);
    if(here.city&&ownerOf(here.p)===k){
      if(total<6)return;
      const send={};
      let kept=0;
      UKEYS.forEach(t=>{
        let n=army.u[t]||0;
        while(n>0&&kept<3){kept++;n--;}
        if(n>0)send[t]=n;
      });
      if(!cnt(send))return;
      if(aiArmyAct(k,cid,send,P,D))acted.add(cid);
    }else{
      if(aiArmyAct(k,cid,{...army.u},P,D))acted.add(cid);
    }
  });
}
function logBattle5(rep){
  const who=empName(rep.attackerKey),def=empName(rep.defOwner);
  if(rep.win)log(who+(rep.city?' stormed <b>'+rep.city+'</b>':' won a field battle')+' against '+def+' (lost '+rep.attLost+', slew '+rep.defLost+').');
  else log(who+' was repelled by '+def+(rep.city?' at <b>'+rep.city+'</b>':'')+' (lost '+rep.attLost+').');
}

function log(msg,cls){
  G.log.unshift({msg,cls:cls||''});
  if(G.log.length>80)G.log.pop();
  const el=$('log');
  if(el)el.innerHTML=G.log.map(l=>'<div class="l '+l.cls+'">'+l.msg+'</div>').join('');
  G._unread=(G._unread||0)+1;
  if(typeof updateLogBadge==='function')updateLogBadge();
}
function empName(k){return k==='neutral'?'Free lords':(EMPIRES[k]?EMPIRES[k].name:k);}
function empColor(k){return k==='neutral'?'#8a8578':(EMPIRES[k]?EMPIRES[k].color:'#8a8578');}
function armyStr(a){
  const parts=[];
  UKEYS.forEach(t=>{if(a[t])parts.push(a[t]+' '+UNITS[t].name.toLowerCase());});
  return parts.length?parts.join(', '):'no troops';
}
function logBattle(rep){
  const who=empName(rep.attackerKey),def=empName(rep.defOwner);
  if(rep.win)log(who+' seized <b>'+rep.to.name+'</b> from '+def+' (lost '+rep.attLost+', slew '+rep.defLost+').');
  else log(who+' was repelled at <b>'+rep.to.name+'</b> by '+def+' (lost '+rep.attLost+').');
}

  const cx=VB.x+VB.w/2,cy=VB.y+VB.h/2;

  let d='';

function smoothPath(pts){                  // Catmull-Rom through the points, emitted as beziers
  if(pts.length<2)return '';

    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;

function cellChain(fromCell,toCell,maxLen){ // shortest hop chain, ignoring who holds the ground
  const dist={};dist[fromCell]=0;const parent={};const q=[fromCell];
  while(q.length){
    const cur=q.shift();

      while(c!==fromCell&&guard++<40){c=parent[c];if(c===undefined)return null;out.unshift(c);}
      return out;

let ROADS=null;
function buildRoads(){
  if(ROADS)return;
  ROADS=[];
  const seen={};
  const cellProv={};for(const cid in MAPD5.cells)cellProv[cid]=MAPD5.cells[cid].p;
  for(const a in CADJ){
    const pa=cellProv[a];
    for(const b of CADJ[a]){
      const pb=cellProv[b];
      if(pa===pb)continue;
      const key=pa<pb?pa+'|'+pb:pb+'|'+pa;
      if(seen[key])continue;seen[key]=1;
      const A=provOf(pa),B=provOf(pb);
      // a road follows the land: hop cell to cell between the two cities, then smooth it
      const chain=cellChain(A.citycell,B.citycell,7);
      let pts;
      if(chain&&chain.length>2){
        pts=chain.map(c=>[MAPD5.cells[c].x,MAPD5.cells[c].y]);
        pts[0]=[A.cx,A.cy];pts[pts.length-1]=[B.cx,B.cy];
      }else{
        const mx=(A.cx+B.cx)/2, my=(A.cy+B.cy)/2;

        const h=((pa.charCodeAt(0)+pb.charCodeAt(1)+pa.length)%7-3)/22;   // deterministic gentle bend

function playAnims(done){
  const q=(G&&G.animQ)?G.animQ:[];
  if(G)G.animQ=[];
  // v5.4d: requestAnimationFrame never fires while the tab is hidden. The turn counter lives in
  // this callback, so a backgrounded tab used to freeze the game mid-end-turn. Skip the show when
  // nobody is watching, and keep a watchdog so a stalled frame can never strand the turn.
  if(!ANIM_ON||!q.length||document.hidden){if(done)done();return;}
  const svg=$('map');
  const layer=document.createElementNS(SVGNS,'g');
  svg.appendChild(layer);
  let i=0;
  let prevTo=null;
  let finished=false,watchdog=null;
  function finish(){
    if(finished)return;
    finished=true;
    if(watchdog){clearTimeout(watchdog);watchdog=null;}
    document.removeEventListener('visibilitychange',onHide);
    if(layer.parentNode)layer.parentNode.removeChild(layer);
    if(done)done();
  }
  function onHide(){if(document.hidden)finish();}   // tabbed away mid-march: finish the turn at once
  document.addEventListener('visibilitychange',onHide);
  function arm(){if(watchdog)clearTimeout(watchdog);watchdog=setTimeout(finish,1500);}
  function next(){
    if(finished)return;
    if(i>=q.length){finish();return;}
    const ev=q[i++];
    let a=cellOf(ev.from);const b=cellOf(ev.to);
    // a chain of hops must start where the last hop ended, or the marker appears to teleport back
    if(prevTo&&ev.from!==prevTo&&CADJ[prevTo]&&CADJ[prevTo].includes(ev.to))a=cellOf(prevTo);
    prevTo=ev.to;
    if(!a||!b){next();return;}
    layer.innerHTML='<g style="color:'+empColor(ev.e)+'"><circle cx="8" cy="8" r="11" fill="'+empColor(ev.e)+'" opacity="0.35"/>'+iconBase(ev.t)+'</g>';
    const g=layer.firstChild;
    const t0=performance.now(),dur=240;
    arm();
    function frame(now){
      if(finished)return;
      let k=Math.min(1,(now-t0)/dur);
      k=k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;   // ease in-out for a smoother march
      g.setAttribute('transform','translate('+(a.x+(b.x-a.x)*k-8)+' '+(a.y+(b.y-a.y)*k-8)+')');

}

    const tot=cnt(a.u);
    if(!tot)continue;
    const col=empColor(a.e);
    const dt=domType(a.u);
    const sel=G.selArmy===cid;
    ah+='<g class="armyfig" data-a="'+cid+'">';
    ah+='<circle cx="'+c.x+'" cy="'+c.y+'" r="'+(16*s)+'" fill="transparent"/>';
    if(sel){
      const rr=21*s;
      ah+='<circle cx="'+c.x+'" cy="'+c.y+'" r="'+rr+'" fill="#c9a227" opacity="0.15"/>';
      ah+='<circle cx="'+c.x+'" cy="'+c.y+'" r="'+rr+'" fill="none" stroke="#fffbe8" stroke-width="'+(2*s)+'" stroke-dasharray="'+(6*s)+' '+(4*s)+'"/>';
    }
    ah+='<g transform="translate('+(c.x-16*s)+' '+(c.y-18*s)+') scale('+fs+')" style="color:'+col+'">'+artBase(dt)+tierChevrons(dt)+'</g>';
    if(close){                        // zoomed out: total only (CoN style), even when selected
      const types=UKEYS.filter(t=>a.u[t]);
      const cw2=22*s, chh=10*s;
      let chy=c.y-Math.min(types.length,6)*(chh+1)/2;
      types.slice(0,6).forEach(t=>{
        ah+='<rect x="'+(c.x+13*s)+'" y="'+chy+'" width="'+cw2+'" height="'+chh+'" rx="'+(3*s)+'" fill="'+col+'" stroke="#241d17" stroke-width="'+(0.7*s)+'"/>';
        ah+='<g transform="translate('+(c.x+13.5*s)+' '+(chy+0.5*s)+') scale('+(0.56*s)+')" style="color:#f5edd8">'+iconBase(t)+'</g>';
        ah+='<text x="'+(c.x+33*s)+'" y="'+(chy+7.8*s)+'" font-size="'+(7*s)+'" font-weight="bold" fill="#fff" text-anchor="end" style="paint-order:stroke;stroke:#241d17;stroke-width:'+(1.4*s)+'px">'+a.u[t]+'</text>';
        chy+=chh+1*s;
      });
    }else{
      ah+='<rect x="'+(c.x+11*s)+'" y="'+(c.y-6*s)+'" width="'+(24*s)+'" height="'+(14*s)+'" rx="'+(3.5*s)+'" fill="'+col+'" stroke="#241d17" stroke-width="'+(0.9*s)+'"/>';
      ah+='<text x="'+(c.x+23*s)+'" y="'+(c.y+4.5*s)+'" font-size="'+(9.5*s)+'" font-weight="bold" fill="#fff" text-anchor="middle" style="paint-order:stroke;stroke:#241d17;stroke-width:'+(1.8*s)+'px">'+tot+'</text>';
    }
    if(a.w)ah+='<text x="'+(c.x-20*s)+'" y="'+(c.y+14*s)+'" font-size="'+(10*s)+'" font-weight="bold" fill="#c94040" style="paint-order:stroke;stroke:#241d17;stroke-width:'+(2*s)+'px">~</text>';
    ah+='</g>';
  }
  // besieged-city rings
  for(const cid in G.armies){
    const a=G.armies[cid];
    if(!a.siege)continue;
    const dc=cellOf(a.siege);
    if(!dc)continue;
    ah+='<path d="'+hexPath(dc.x,dc.y,13*s)+'" fill="none" stroke="#c94040" stroke-width="'+(1.8*s)+'" stroke-dasharray="'+(4*s)+' '+(3*s)+'"/>';
  }
  svg.querySelector('#gArmy').innerHTML=ah;
  // draw march-order routes (dashed) for the player's armies
  let oh='';
  const sw=Math.max(1.2,2.2*s);
  for(const cid in G.armies){
    const a=G.armies[cid];
    if(a.e!==G.player||!a.ord)continue;
    const path=fullPathTo(cid,a.ord,G.player);
    if(!path||path.length<2)continue;
    let d='M'+cellOf(path[0]).x+' '+cellOf(path[0]).y;
    for(let i=1;i<path.length;i++)d+=' L'+cellOf(path[i]).x+' '+cellOf(path[i]).y;
    oh+='<path d="'+d+'" fill="none" stroke="#241d17" stroke-width="'+(sw+1.4*s)+'" stroke-linecap="round" opacity="0.35"/>';
    oh+='<path d="'+d+'" fill="none" stroke="#fffbe8" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+(5*s)+' '+(4*s)+'"/>';
    const dc=cellOf(a.ord);
    oh+='<circle cx="'+dc.x+'" cy="'+dc.y+'" r="'+(4*s)+'" fill="none" stroke="#fffbe8" stroke-width="'+(1.6*s)+'"/>';
  }
  let ol=svg.querySelector('#gOrder');
  if(!ol){ol=document.createElementNS(SVGNS,'g');ol.id='gOrder';svg.insertBefore(ol,svg.querySelector('#gArmy'));}
  ol.innerHTML=oh;
  // fleets stand on their sea cell, drawn like armies do on land
  let zh='';
  for(const sid in (G.navy||{})){
    const f=G.navy[sid];
    const sc=SEA[sid];
    if(!sc||!f.n)continue;
    const selCls=G.selSea===sid?' zsel':'';
    zh+='<g class="zone'+selCls+'" data-f="'+sid+'">';
    zh+='<circle cx="'+sc.x+'" cy="'+sc.y+'" r="'+(15*s)+'" fill="transparent"/>';
    zh+='<circle cx="'+sc.x+'" cy="'+sc.y+'" r="'+(11*s)+'" class="zc" fill="'+empColor(f.e)+'" fill-opacity="0.35"/>';
    zh+='<g transform="translate('+(sc.x-9*s)+' '+(sc.y-10*s)+') scale('+(0.62*s)+')" style="color:'+empColor(f.e)+'">'+ART.ship+'</g>';
    const chipX=sc.x+11*s, chipY=sc.y-8*s;
    zh+='<rect x="'+chipX+'" y="'+chipY+'" width="'+(26*s)+'" height="'+(15*s)+'" rx="'+(4*s)+'" fill="'+empColor(f.e)+'" stroke="#241d17" stroke-width="'+s+'"/>';
    zh+='<text x="'+(chipX+13*s)+'" y="'+(chipY+11.5*s)+'" text-anchor="middle" font-size="'+(11*s)+'" font-weight="bold" fill="#fff">'+f.n+'</text>';
    if(loadCount(f))zh+='<text x="'+sc.x+'" y="'+(sc.y+20*s)+'" text-anchor="middle" font-size="'+(10*s)+'" fill="#f5edd8" style="paint-order:stroke;stroke:#241d17;stroke-width:'+(2*s)+'px">&#9876; '+loadCount(f)+'</text>';
    zh+='</g>';
  }
  svg.querySelectorAll('#gSea path').forEach(el=>{
    const sid=el.getAttribute('data-s');
    el.classList.toggle('ssel',G.selSea===sid);
    el.classList.toggle('stgt',!!(G.seaTargeting&&G.selSea&&G._seaTargets&&G._seaTargets[sid]));
  });
  svg.querySelector('#gZone').innerHTML=zh;
  renderBar();
}
function renderHdr(){

  $('hEmpName').textContent=EMPIRES[G.player].name;
  $('hGold').textContent=e.gold;

}

// ==== seg_tech.js ====
function techEffect(tr,lv){
  const pct=10*lv;
  if(tr==='blades')return '+'+pct+'% infantry strength';
  if(tr==='fletch')return '+'+pct+'% archer strength & volleys';
  if(tr==='horse')return '+'+pct+'% cavalry strength'+(lv>=3?' · cavalry range 3':'');
  if(tr==='siege')return '+'+pct+'% siege strength · +'+(5*lv)+'% vs capitals';
  if(tr==='sea')return '+'+(12*lv)+'% fleet strength'+(lv>=3?' · fleets sail 2 seas':'');
  return '';
}
function showTech(){
  const e=G.emp[G.player];
  const left=researchesLeft();
  let h='<div class="meta" style="margin-bottom:8px">You may complete <b>'+RESEARCH_PER_TURN+' researches per turn</b> &mdash; <b style="color:'+(left?'var(--gold)':'var(--danger)')+'">'+left+' remaining this turn</b>. Effects apply empire-wide and show in battle odds.</div>';
  TKEYS.forEach(tr=>{
    const T=TECH[tr];
    const lv=e.tech[tr]||0;
    const next=lv<3?T.lv[lv]:null;
    const pct=Math.round(lv/3*100);
    h+='<div class="trow">'+artSvg(T.icon,34,'#c9a227');
    h+='<div class="tinfo"><div class="tname">'+T.name+' <span class="pips">'+'&#9679;'.repeat(lv)+'&#9675;'.repeat(3-lv)+'</span></div>';
    h+='<div class="rbar" style="height:6px;margin:4px 0"><div style="width:'+pct+'%;height:6px;background:'+(lv>=3?'#7ec97e':'var(--gold)')+'"></div></div>';
    h+='<div class="tdesc">'+T.units+' &middot; '+(lv>0?techEffect(tr,lv):'no bonus yet')+'</div>';
    h+=next?'<div class="tnext">Next: <b>'+next.n+'</b> ('+next.c+'g) &rarr; '+techEffect(tr,lv+1)+'</div>':'<div class="tnext" style="color:#7ec97e">Mastered</div>';
    h+='</div>';
    if(next)h+='<button '+(e.gold<next.c||left<=0?'disabled':'class="primary"')+' onclick="doResearch(\''+tr+'\')">'+next.c+'g</button>';
    h+='</div>';
  });
  showModal('Tech tree &mdash; '+e.gold+' gold',h,[['Close',closeModal,'primary']]);
}
function doResearch(tr){
  if(researchTech(G.player,tr)){
    const lv=G.emp[G.player].tech[tr];
    log('Your scholars mastered <b>'+TECH[tr].lv[lv-1].n+'</b> ('+techEffect(tr,lv)+').','turnmark');
    renderHdr();
    saveGame();
    showTech();
  }
}

    h+='<h3 style="margin:8px 0 4px">'+TRACKS[tk].name+(TRACKS[tk].ranged?' (ranged)':'')+'</h3><div class="ucards">';
    UKEYS.filter(t=>UNITS[t].track===tk).sort((a,b)=>UNITS[a].tier-UNITS[b].tier).forEach(t=>{
      const u=UNITS[t];

      h+='<div class="stats">Tier '+u.tier+' &middot; '+u.cost+'g &middot; dmg '+u.dmg+' &middot; HP '+u.hp+' &middot; armor '+u.armor+'</div>';
      h+='<div class="vs">Beats: '+u.beats.map(b=>uicon(b,'#5aa858')).join('')+'</div>';
      h+='<div class="vs">Beaten by: '+Object.keys(TRACKS).filter(e=>TRACKS[e].beats.includes(tk)).map(b=>uicon(b,'#c94040')).join('')+'</div>';

}


// ==== v5_ui_panels.js ====
// ================= V5 selection, panels, division card, turn =================
function armyClick(cid){
  if(G.over)return;
  if(G.targeting&&G.selArmy&&G.marchInfo&&G.marchInfo.targets[cid]){cellClick(cid);return;}
  G.marchInfo=null;G.seaTargeting=false;G.selSea=null;G.selCity=null;
  if(G.selArmy!==cid){G.send={};G.forced=false;}
  G.selArmy=cid;
  const mine=G.armies[cid]&&G.armies[cid].e===G.player;
  G.targeting=!!mine;                 // auto-arm: pick your army, then click a target directly
  if(mine)computeMarch();
  if(mine&&forceRange(G.armies[cid],G.armies[cid].u)<=0&&!G.armies[cid].ord&&!G.armies[cid].siege)
    toast('This army has no movement left this turn &mdash; click a distant cell to set a march order for next turn.');
  renderAll();
  openArmyPanel(cid);
}
function cityClick(pid){
  if(G.over)return;
  const cc=provOf(pid).citycell;
  if(G.targeting&&G.selArmy&&G.marchInfo){cellClick(cc);return;}
  G.targeting=false;G.marchInfo=null;G.seaTargeting=false;G.selSea=null;
  const gar=G.armies[cc];
  if(G.selCity!==pid){G.send={};G.forced=false;}
  G.selArmy=(gar&&gar.e===G.player)?cc:null;
  G.selCity=pid;
  G.targeting=!!G.selArmy;
  if(G.selArmy)computeMarch();
  renderAll();
  openCityPanel(pid);
}
function cellClick(cid){
  if(G.over)return;
  // far-destination order: in targeting mode, clicking a reachable but out-of-range own/empty cell sets a march order
  if(G.targeting&&G.selArmy&&G.marchInfo&&!G.marchInfo.targets[cid]){
    const a=G.armies[G.selArmy];
    const destCell=cellOf(cid);
    const enemyHere=G.armies[cid]&&G.armies[cid].e!==G.player;
    const foreignCity=destCell.city&&ownerOf(destCell.p)!==G.player;
    const hostile=enemyHere||foreignCity;
    // clicking a peaceful empire's land: offer the declaration rather than a dead "no route"
    const destOwner=cellOwnerOf(cid);
    const peaceBlock=(destOwner!=='neutral'&&destOwner!==G.player&&!hostileTo(G.player,destOwner))?destOwner:blockerAt(cid,G.player);
    if(a&&peaceBlock){
      const nm=empName(peaceBlock);
      showModal('Declare war on '+nm+'?',
        '<div class="meta">You are at peace with '+nm+'. Their borders are sealed &mdash; your armies cannot enter or strike until war is declared.</div>'+
        '<div class="meta">War costs no gold, but every other crown will note your appetite for conquest.</div>',
        [['Declare war',()=>{closeModal();declareWar(G.player,peaceBlock);G.targeting=true;computeMarch();renderAll();saveGame();toast('War declared on '+nm+'. Their lands are open — choose your target.');},'primary'],
         ['Keep the peace',()=>{closeModal();G.targeting=false;G.marchInfo=null;renderAll();},'']]);
      return;
    }
    if(a){
      const path=fullPathTo(G.selArmy,cid,G.player);
      if(path&&path.length>1){
        delete a.siege;                       // any new order breaks a siege
        a.ord=cid;
        G.targeting=false;G.marchInfo=null;
        if(hostile)toast('March order set &mdash; the army will halt beside the enemy at <b>'+(destCell.city?provOf(destCell.p).city:'the target')+'</b>; order the attack when it arrives.');
        advanceOrders(G.player);
        const cur=Object.keys(G.armies).find(k=>G.armies[k]===a)||G.selArmy;
        G.selArmy=(G.armies[cur]&&G.armies[cur].e===G.player)?cur:null;
        playAnims(()=>{renderAll();if(G.selArmy)openArmyPanel(G.selArmy);saveGame();});
        return;
      }
      // no land path — explain why instead of failing silently
      const p1=provOf(cellOf(G.selArmy).p),p2=provOf(destCell.p);
      const shared=(p1.zones||[]).filter(z=>(p2.zones||[]).includes(z));
      if(shared.length)toast('No land route. To ferry armies across the '+ZONES[shared[0]].name+', your fleet must hold that sea uncontested &mdash; then the enemy coast appears as a target.');
      else toast('No route to that cell.');
    }
    G.targeting=false;G.marchInfo=null;renderAll();return;
  }
  if(!(G.targeting&&G.selArmy&&G.marchInfo&&G.marchInfo.targets[cid])){
    G.targeting=false;G.marchInfo=null;
    G.selCity=null;closeDrawer();       // empty-map click clears the drawer, CoN style
    renderAll();return;
  }
  const from=G.selArmy;
  const army=G.armies[from];
  if(!army){G.targeting=false;G.marchInfo=null;G.selArmy=null;renderAll();return;}   // selected army no longer exists
  const want={};
  UKEYS.forEach(t=>{want[t]=Math.max(0,Math.min((G.send&&G.send[t])||0,army.u[t]||0));});
  if(cnt(want)===0){G.targeting=false;G.marchInfo=null;renderAll();return;}
  const tg=G.marchInfo.targets[cid];
  const def=G.armies[cid];
  const forced=!!G.forced;
  const blocker=blockerAt(cid,G.player);
  if(blocker){                              // a treaty stands between you and this target
    const nm=empName(blocker);
    showModal('Declare war on '+nm+'?',
      '<div class="meta">You are at peace with '+nm+'. Their armies and cities cannot be touched until war is declared.</div>'+
      '<div class="meta">Declaring war costs nothing in gold, but every other crown will note your appetite for conquest (their opinion of you drops).</div>',
      [['Declare war',()=>{closeModal();declareWar(G.player,blocker);G.targeting=true;computeMarch();renderAll();toast('War declared on '+nm+'. Choose your target again.');},'primary'],
       ['Keep the peace',()=>{closeModal();G.targeting=false;G.marchInfo=null;renderAll();},'']]);
    return;
  }
  if(def&&def.e!==G.player){
    const force={};for(const t in want)if(want[t])force[t]=want[t];
    const isFm=forced&&!tg.sea&&tg.d>forceRange(army,force);
    const p=oddsOf5(force,cid,isFm,G.player);
    const pct=Math.round(p*100);
    const cell=cellOf(cid);
    const nm=cell.city?provOf(cell.p).city:'the enemy army';
    const btns=[['Assault!',()=>{closeModal();doMarch(from,cid,want,forced);},'primary']];
    if(cell.city){btns.push(['Lay siege',()=>{closeModal();doSiege(from,cid,want);},'']);}
    btns.push(['Cancel',closeModal,'']);
    showModal('Attack '+nm+'?',
      battleCard(force,G.player,def.u,def.e)+
      (isFm?'<div class="meta" style="text-align:center">Forced march: your troops fight winded (&minus;20%).</div>':'')+
      '<div style="text-align:center;margin-top:4px">Estimated odds: <b>'+pct+'%</b> &mdash; '+oddsLabel(p)+'</div>'+
      (cell.city?'<div class="meta" style="text-align:center;margin-top:4px">Or lay siege: dig in next to the city and starve the garrison down over several turns (slow but no assault losses).</div>':''),
      btns);
  }else{
    doMarch(from,cid,want,forced);
  }
}
function doMarch(from,cid,want,forced){
  if(G.armies[from]){delete G.armies[from].ord;delete G.armies[from].siege;}
  const r=executeMarch(from,cid,want,forced,G.player);
  G.targeting=false;G.marchInfo=null;
  G.selArmy=(r&&r.type==='battle'&&!r.rep.win)?(G.armies[from]?from:null):(G.armies[cid]&&G.armies[cid].e===G.player?cid:null);
  G.send={};
  playAnims(()=>{
    renderAll();
    if(r&&r.type==='battle'){
      logBattle5(r.rep);
      let b='';
      if(r.rep.defVolley)b+='Their archers felled '+r.rep.defVolley+' of your troops.<br>';
      if(r.rep.attVolley)b+='Your archers cut down '+r.rep.attVolley+' defenders.<br>';
      b+=r.rep.win
        ?'<span class="good">Victory!'+(r.rep.city?' '+r.rep.city+' is yours.':'')+'</span><br>You lost '+r.rep.attLost+'; the enemy lost '+r.rep.defLost+'.'
        :(r.rep.held
          ?'<span style="color:var(--gold)">Both lines held.</span> Your army fell back wounded.<br>You lost '+r.rep.attLost+'; the enemy lost '+r.rep.defLost+'. Wounds heal each turn — press the attack or regroup.'
          :'<span class="bad">Defeat. Your assault was broken.</span><br>You lost '+r.rep.attLost+'; the enemy lost '+r.rep.defLost+'.');
      if(!G.over)showModal(r.rep.win?'Victory':(r.rep.held?'Stalemate':'Repelled'),b,[['Continue',closeModal,'primary']]);
    }
    if(G.selArmy)openArmyPanel(G.selArmy);
    saveGame();
  });
}
function openArmyPanel(cid){
  const a=G.armies[cid];
  if(!a){closeDrawer();return;}
  if(a.e===G.player&&!G.over){          // your armies live in the division card (CoN style); orders/siege rows render there
    closeDrawer();
    renderBar();
    return;
  }
  const c=cellOf(cid);
  const pv=provOf(c.p);
  let h='<div class="meta">Near '+pv.city+' ('+empName(ownerOf(c.p))+' land)'+(a.w?' &middot; <span style="color:var(--danger)">winded</span>':'')+'</div>';
  h+='<table class="utable">';
  UKEYS.forEach(t=>{
    if(!a.u[t])return;
    const pool=a.u[t]*UNITS[t].hp;
    const pct=Math.round(100*(pool-Math.min((a.d&&a.d[t])||0,pool))/pool);
    h+='<tr><td>'+uicon(t)+UNITS[t].name+'</td><td>'+a.u[t]+(pct<100?' <span style="color:'+(pct<50?'#c94040':'#c9a227')+'">'+pct+'%</span>':'')+'</td></tr>';
  });
  h+='<tr><td><b>Total</b></td><td><b>'+cnt(a.u)+'</b></td></tr></table>';
  $('panel').innerHTML=h;
  showDrawer(empName(a.e)+' army');
}
function setCityTab(tab){G.cityTab=tab;if(G.selCity)openCityPanel(G.selCity);}
function openCityPanel(pid){
  const pv=provOf(pid);
  const own=ownerOf(pid);
  const mine=own===G.player;
  const e=G.emp[G.player];
  const gar=G.armies[pv.citycell];
  const tab=mine?(G.cityTab||'ov'):'ov';
  let h='';
  if(mine&&!G.over){
    h+='<div class="dtabs">';
    [['ov','Overview'],['rec','Recruit'],['bld','Buildings']].forEach(x=>{
      h+='<button class="'+(tab===x[0]?'on':'')+'" onclick="setCityTab(\''+x[0]+'\')">'+x[1]+'</button>';
    });
    h+='</div>';
  }
  if(tab==='ov'||!mine){
    const inc=mine?Math.round(cityIncome(pid,own)):null;
    h+='<div class="meta">'+empName(own)+(mine?' &middot; '+inc+' gold/turn'+(occupTurnsLeft(pid)?' <span style="color:var(--danger)">(unrest &minus;50%, '+occupTurnsLeft(pid)+' turns left)</span>':''):'')+' &middot; '+pv.cells.length+' lands'+(pv.cap?' &middot; capital':'')+'</div>';
    if(gar){
      if(mine)h+='<div class="meta">Garrison: '+cnt(gar.u)+' troops</div>';
      else{const b=garrisonBand(cnt(gar.u));h+='<div class="meta">Garrison: <span style="color:'+b.cls+'">'+b.txt+'</span> ('+empName(gar.e)+') &mdash; scouts report strength, not numbers.</div>';}
    }else h+='<div class="meta">Garrison: <span style="color:#7ec97e">undefended</span></div>';
    const blds=BKEYS.filter(b=>bldLv(pid,b)).map(b=>BLD[b].name+' L'+bldLv(pid,b));
    h+='<div class="meta">Buildings: '+(blds.length?blds.join(', '):'none')+'</div>';
    if(mine)h+='<div class="meta">'+(isHomeCity(pid,G.player)?'<span style="color:var(--gold)">Homeland city</span> &mdash; can build.'
      :isAnnexed(pid,G.player)?'<span style="color:var(--gold)">Annexed city</span> &mdash; can build.'
      :'Conquered city &mdash; tier-1 recruits only until you annex it.')+'</div>';
    const q0=(G.buildQ||{})[pid];

function renderBar(){
  const bar=$('abar');
  if(!bar)return;
  if(!G||!G.selArmy||G.over){bar.style.display='none';return;}
  const a=G.armies[G.selArmy];
  if(!a||a.e!==G.player){bar.style.display='none';return;}
  const tot=cnt(a.u);
  if(!tot){bar.style.display='none';return;}
  if(!G.send)G.send={};
  const col=empColor(G.player);
  const wsel={};UKEYS.forEach(t=>{
    const n=a.u[t]||0;
    if(n&&(G.send[t]===undefined||G.send[t]>n))G.send[t]=n;
    wsel[t]=Math.max(0,Math.min((G.send[t]||0),n));
  });
  const sending=cnt(wsel);
  const rng=forceRange(a,wsel)+(G.forced?2:0);
  const status=a.w?'Winded':(forceRange(a,a.u)<=0?'Marched':'Ready');
  const stCls=status==='Ready'?'ok':(status==='Winded'?'bad':'');
  const str=Math.round(strength(a.u,{},false,false,G.player));
  const pv=provOf(cellOf(G.selArmy).p);
  const onCity=!!cellOf(G.selArmy).city;
  let h='<div class="dcHead"><span class="crest" style="background:'+col+'"></span>';
  h+='<div class="dcT"><div class="dcTitle">'+(onCity?'Garrison of ':'Army near ')+pv.city+'</div><div class="dcSub">'+empName(G.player)+' &middot; '+tot+' troops</div></div>';
  h+='<span class="pill '+stCls+'">'+status+'</span><span class="pill">Range '+rng+'</span></div>';
  h+='<div class="dcBody">';
  h+='<div class="dcSum"><div class="lb">TROOPS</div><div class="vl">'+tot+'</div><div class="lb">STRENGTH</div><div class="vl">~'+str+'</div><div class="lb">SENDING</div><div class="vl gold">'+sending+'/'+tot+'</div></div>';
  h+='<div class="dcTiles">';
  UKEYS.forEach(t=>{
    const n=a.u[t]||0;
    if(!n)return;
    const pool=n*UNITS[t].hp;
    const hpPct=Math.max(6,Math.round(100*(pool-Math.min((a.d&&a.d[t])||0,pool))/pool));
    h+='<div class="tile">'+artSvg(t,42,col)+'<span class="tn">x'+n+'</span>';
    h+='<div class="rbar" title="'+hpPct+'% strength"><div style="width:'+hpPct+'%'+(hpPct<50?';background:#c94040':(hpPct<85?';background:#c9a227':''))+'"></div></div>';
    h+='<div class="tstep"><button onclick="bumpSend(\''+t+'\',-1)">&minus;</button><span>'+wsel[t]+'</span><button onclick="bumpSend(\''+t+'\',1)">+</button></div></div>';
  });
  h+='</div>';
  h+='<div class="dcAct"><div><button onclick="setSendAll(1)">All</button><button onclick="setSendAll(0)">None</button></div>';
  h+='<button '+(G.forced?'class="primary"':'')+' onclick="toggleForced()" title="+2 cells, arrive winded (-20% until next turn)">Forced march</button>';
  h+='<button class="primary" onclick="startTargeting()">'+(G.targeting?'Click a target...':'Choose target')+'</button></div>';
  h+='</div>';
  if(a.siege){                          // CoN-style status rows inside the division card
    const sgar=G.armies[a.siege];
    h+='<div class="dcRow">&#9876; Besieging <b>'+provOf(cellOf(a.siege).p).city+'</b> &middot; garrison '+(sgar?cnt(sgar.u):0)+' starving &middot; moving lifts the siege<button onclick="doLiftSiege(\''+G.selArmy+'\')">Lift siege</button></div>';
  }
  if(a.ord){
    const eta=orderEtaTurns(G.selArmy);
    h+='<div class="dcRow">&#8674; Marching to <b>'+provOf(cellOf(a.ord).p).city+'</b>'+(eta?' &middot; arrives in '+eta+' turn'+(eta>1?'s':''):'')+'<button onclick="cancelOrder(\''+G.selArmy+'\')">Cancel</button></div>';
  }
  bar.innerHTML=h;
  bar.style.display='block';
}
function bumpSend(t,d){
  const a=G.armies[G.selArmy];
  G.send[t]=Math.max(0,Math.min(a.u[t]||0,(G.send[t]||0)+d));
  if(G.targeting)computeMarch();
  renderBar();
  if(G.targeting)updateMap();
}
function setSendAll(on){
  const a=G.armies[G.selArmy];
  UKEYS.forEach(t=>{G.send[t]=on?(a.u[t]||0):0;});
  if(G.targeting)computeMarch();
  renderBar();
  if(G.targeting)updateMap();
}
function toggleForced(){
  G.forced=!G.forced;
  if(G.targeting)computeMarch();
  renderBar();
  if(G.targeting)updateMap();
}
function computeMarch(){
  if(!G.selArmy||!G.armies[G.selArmy]){G.marchInfo=null;return;}
  const a=G.armies[G.selArmy];
  const want={};
  UKEYS.forEach(t=>{want[t]=Math.max(0,Math.min((G.send&&G.send[t])||0,a.u[t]||0));});
  G.marchInfo=cnt(want)?marchTargets5(G.selArmy,want,!!G.forced):null;
}
function startTargeting(){
  G.targeting=true;
  computeMarch();
  if(G.marchInfo&&Object.keys(G.marchInfo.targets).length===0)
    toast('No reachable targets this turn &mdash; click a distant cell to set a multi-turn march order.');
  updateMap();
  if(G.selArmy)openArmyPanel(G.selArmy);
}
function playerMovableArmies(){
  return armiesOf(G.player).filter(c=>{
    const a=G.armies[c];
    return !a.siege&&!a.ord&&forceRange(a,a.u)>0;   // besiegers and ordered armies are already tasked
  });
}
function playerCanStillMove(){return playerMovableArmies().length>0;}
function jumpToArmy(cid){
  closeModal();
  const c=cellOf(cid);
  if(c){
    VB.w=Math.min(VB.w,MAPD5.W/4);VB.h=VB.w*MAPD5.H/MAPD5.W;
    VB.x=c.x-VB.w/2;VB.y=c.y-VB.h/2;
    applyVB();
  }
  armyClick(cid);
}
function showStandings(){
  const rows=Object.keys(G.emp).map(k=>({k,n:provsOf(k).length,cells:cellsOf(k).length,alive:G.emp[k].alive}))
    .sort((a,b)=>b.n-a.n);
  let h='<table class="utable"><tr><td><b>Empire</b></td><td><b>Cities</b></td><td><b>Lands</b></td></tr>';
  rows.forEach(r=>{
    const st=(r.k===G.player||!r.alive)?'':(atWar(G.player,r.k)?' <span style="color:var(--danger);font-size:11px">at war</span>':' <span style="color:#7ec97e;font-size:11px">at peace</span>');
    h+='<tr'+(r.k===G.player?' style="font-weight:bold"':'')+'><td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+empColor(r.k)+';margin-right:6px"></span>'+empName(r.k)+(r.alive?'':' &dagger;')+(r.k===G.player?' (you)':st)+'</td><td>'+r.n+'</td><td>'+r.cells+'</td></tr>';
  });
  h+='</table><div class="meta" style="margin-top:6px">First to hold '+NEED5+' cities rules the world.</div>';
  showModal('Standings &mdash; turn '+G.turn,h,[['Close',closeModal,'primary']]);
}
function endTurn(){
  if(G.over)return;
  if(!G._skipMoveWarn&&playerCanStillMove()){
    const movable=playerMovableArmies();
    let lst='<div class="meta">These armies can still move or attack this turn (click one to jump to it):</div>';
    movable.slice(0,8).forEach(c=>{
      const a=G.armies[c];
      const pv=provOf(cellOf(c).p);
      lst+='<button style="display:block;width:100%;margin-top:4px;text-align:left" onclick="jumpToArmy(\''+c+'\')">'+(cellOf(c).city?'Garrison of ':'Army near ')+pv.city+' &mdash; '+cnt(a.u)+' troops</button>';
    });
    if(movable.length>8)lst+='<div class="meta">&hellip;and '+(movable.length-8)+' more.</div>';
    showModal('End turn?',lst,
      [['End turn anyway',()=>{closeModal();G._skipMoveWarn=true;endTurn();G._skipMoveWarn=false;},'primary'],['Keep playing',closeModal,'']]);
    return;
  }
  $('endTurn').disabled=true;
  G.animQ=[];
  try{Object.keys(G.emp).forEach(k=>{if(k!==G.player)aiTurn(k);});}
  catch(e){console.error('AI turn error:',e);}
  playAnims(()=>{
    if(!G.over){
      G.turn++;
      armiesOf(G.player).forEach(c=>{G.armies[c].mv=0;G.armies[c].w=0;});
      naviesOf(G.player).forEach(sid=>{G.navy[sid].mv=0;});
      G.animQ=[];
      resolveSieges(G.player);
      advanceOrders(G.player);
      advanceNavyOrders(G.player);     // fleets carry on toward their destination too
      healArmies(G.player);            // wounds mend: cities 50%, own land 25%, abroad 10%
      processBuilds(G.player);         // construction advances
      processTraining(G.player);       // recruits finish training
      growNeutrals();                  // free lords raise troops and fortify
      tickOccupation(G.player);        // captured cities settle toward full income
      tickDiplomacy();                 // truces expire, memories fade
      G.rec={};                        // fresh recruit cap each turn
      G.res=0;                         // research allowance refreshes
      G.emp[G.player].gold+=incomeOf(G.player);
      log('Turn '+G.turn+' — your coffers grow by '+incomeOf(G.player)+' gold.','turnmark');
    }
    // play the post-turn marches/sieges instead of leaving them queued for the next action
    playAnims(()=>{
      $('endTurn').disabled=false;
      G.targeting=false;G.marchInfo=null;
      renderAll();
      saveGame();
    });
  });
}
function gameOver(win,msg){
  G.over=true;
  clearSave();
  log(msg,'turnmark');
  showModal(win?'THE WORLD IS YOURS':'THE CROWN IS LOST',
    msg+'<br><br>'+(win?'A golden age begins under your rule.':'History will remember your attempt.'),
    [['Play again',()=>location.reload(),'primary']],{persist:true});
}

function cancelOrder(cid){
  if(G.armies[cid])delete G.armies[cid].ord;
  renderAll();openArmyPanel(cid);saveGame();
}

function doSiege(from,cid,want){
  if(G.armies[from])delete G.armies[from].ord;
  const ok=layStartSiege(from,cid,want,G.player);
  G.targeting=false;G.marchInfo=null;G.send={};
  playAnims(()=>{
    // reselect the besieging army (it's now on the cell adjacent to the city)
    let where=null;for(const c in G.armies){if(G.armies[c].e===G.player&&G.armies[c].siege===cid){where=c;break;}}
    G.selArmy=where;
    renderAll();
    if(where)openArmyPanel(where);
    saveGame();
  });
}

function doLiftSiege(cid){ liftSiege(cid); renderAll(); openArmyPanel(cid); saveGame(); }
