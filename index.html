function seaClick(sid){
  if(G.over)return;
  const f=navyAt(sid);
  // giving a standing fleet its order
  if(G.seaTargeting&&G.selSea&&G.selSea!==sid){
    const me=navyAt(G.selSea);
    if(me&&me.e===G.player){
      const foe=navyAt(sid);
      if(foe&&foe.e!==G.player){
        if(!hostileTo(G.player,foe.e)){offerWar(foe.e);return;}
        const rep=navalClash(G.selSea,sid,G.player);
        if(rep){
          log(rep.win?('Your fleet broke '+empName(rep.def)+"'s galleys at sea."):('Your fleet was shattered by '+empName(rep.def)+' at sea.'),rep.win?'':'bad');
          G.seaTargeting=false;G.selSea=rep.win?sid:null;
          renderAll();if(G.selSea)openSeaPanel(G.selSea);saveGame();
          showModal(rep.win?'Naval victory':'Fleet lost',
            (rep.win?'<span class="good">The sea is yours.</span>':'<span class="bad">Your galleys were sunk.</span>')+
            '<br>You lost '+rep.attLost+' galleys; the enemy lost '+rep.defLost+'.',
            [['Continue',closeModal,'primary']]);
          return;
        }
        toast('That fleet is out of reach this turn.');
        return;
      }
      const cost=moveNavy(G.selSea,sid,G.player);
      if(cost){
        const arrived=navyAt(sid); if(arrived)delete arrived.ord;
        G.seaTargeting=false;G.selSea=sid;
        playAnims(()=>{renderAll();openSeaPanel(sid);saveGame();});
        return;
      }
      const r=sailToward(G.selSea,sid,G.player);       // too far for one turn: sail as far as we can
      if(r&&r.moved){
        G.seaTargeting=false;G.selSea=r.at;
        log('Your fleet sets a course &mdash; '+r.left+' cell'+(r.left===1?'':'s')+' still to run.');
        playAnims(()=>{renderAll();openSeaPanel(r.at);saveGame();});
        return;
      }
      toast('No sea route there — an enemy fleet may be in the way.');
      return;
    }
  }
  G.seaTargeting=false;G.targeting=false;G.selArmy=null;G.selCity=null;
  G.selSea=f?sid:null;
  renderAll();
  if(f)openSeaPanel(sid); else closeDrawer();
}
function startSeaTargeting(){
  G.seaTargeting=true;
  G._seaTargets={};
  const f=navyAt(G.selSea);
  if(f&&f.e===G.player){
    const mm=seaMap(G.selSea,G.player,fleetRange(f));
    for(const k in mm.dist)if(k!==G.selSea)G._seaTargets[k]=1;   // hostile cells are in here too: reachable, but only as a target
  }
  renderAll();
  openSeaPanel(G.selSea);
}
function openSeaPanel(sid){
  const f=navyAt(sid);
  if(!f){closeDrawer();return;}
  const mine=f.e===G.player;
  let h='<div class="meta">'+empName(f.e)+' &middot; '+f.n+' galley'+(f.n>1?'s':'')+'</div>';
  if(mine){
    h+='<div class="meta">Sail left this turn: <b>'+fleetRange(f)+'</b> of '+shipSpeed(G.player)+' cells</div>';
    if(f.ord&&SEA[f.ord]){
      const rest=seaFullPath(sid,f.ord,G.player);
      const legs=rest?rest.length-1:0;
      const turns=Math.max(1,Math.ceil(legs/shipSpeed(G.player)));
      h+='<div class="buildrow"><span>&#9973; Sailing on &mdash; '+legs+' cell'+(legs===1?'':'s')+' to go, about '+turns+' turn'+(turns===1?'':'s')+'</span><button onclick="cancelSail(\''+sid+'\')">Cancel</button></div>';
    }
    const carried=loadCount(f);
    h+='<div class="meta">Hold: '+carried+' / '+(f.n*SHIP_CAPACITY)+' troops</div>';
    if(carried){
      h+='<table class="utable">';
      UKEYS.forEach(t=>{if(f.load[t])h+='<tr><td>'+uicon(t)+UNITS[t].name+'</td><td>'+f.load[t]+'</td></tr>';});
      h+='</table>';
    }
    if(!G.over){
      h+='<button class="primary" style="width:100%;margin-top:8px" onclick="startSeaTargeting()">'+(G.seaTargeting?'Click a sea to sail to':'Choose target')+'</button>';
      embarkableAt(sid,G.player).forEach(cid=>{
        const a=G.armies[cid];
        h+='<button style="width:100%;margin-top:6px" onclick="uiEmbark(\''+sid+'\',\''+cid+'\')">Take aboard '+cnt(a.u)+' troops from '+provOf(cellOf(cid).p).city+'</button>';
      });
      if(carried){
        shoreLandCells(sid,G.player).slice(0,6).forEach(cid=>{
          h+='<button style="width:100%;margin-top:6px" onclick="uiLand(\''+sid+'\',\''+cid+'\')">Land troops near '+provOf(cellOf(cid).p).city+'</button>';
        });
        if(!shoreLandCells(sid,G.player).length)h+='<div class="meta">No open shore here to land on.</div>';
      }
    }
  }else{
    h+='<div class="meta">Enemy galleys bar this water.</div>';
  }
  $('panel').innerHTML=h;
  showDrawer((mine?'Your fleet':empName(f.e)+' fleet'));
}
function cancelSail(sid){
  const f=navyAt(sid);
  if(f)delete f.ord;
  renderAll();openSeaPanel(sid);saveGame();
}
function uiEmbark(sid,cid){
  const n=doEmbark(sid,cid);
  if(n)log(n+' troops boarded your galleys.');
  else toast('The holds are full.');
  G.selArmy=null;renderAll();openSeaPanel(sid);saveGame();
}
function uiLand(sid,cid){
  const n=doLand(sid,cid);
  if(n)log(n+' troops came ashore near '+provOf(cellOf(cid).p).city+'.');
  renderAll();openSeaPanel(sid);saveGame();
}
function buyShip(pid){
  const e=G.emp[G.player];
  if(!e||ownerOf(pid)!==G.player||!isPort(pid))return;
  if(e.gold<SHIP.cost){toast('Not enough gold for a '+SHIP.name+'.');return;}
  const free=portCellsFree(pid,G.player);
  if(!free.length){toast('An enemy fleet is blockading this port.');return;}
  e.gold-=SHIP.cost;
  addNavy(free[0],G.player,1,true);
  log('A '+SHIP.name+' slips out of '+provOf(pid).city+'.');
  renderHdr();renderAll();openCityPanel(pid);saveGame();
}

// ==== seg_input.js ====
function initInput(){
  const svg=$('map');
  const ptrs=new Map();
  let dragging=false,moved=0,lastX=0,lastY=0,pinchD=0,downT=null;
  svg.addEventListener('pointerdown',e=>{
    downT=e.target;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1){dragging=true;moved=0;lastX=e.clientX;lastY=e.clientY;}
    else if(ptrs.size===2){
      const a=[...ptrs.values()];
      pinchD=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    }
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId))return;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===2){
      const a=[...ptrs.values()];
      const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      if(pinchD>0&&Math.abs(d-pinchD)>2){zoomBy(pinchD/d);pinchD=d;}
      moved=99;
      return;
    }
    if(!dragging)return;
    const dx=e.clientX-lastX,dy=e.clientY-lastY;
    moved+=Math.abs(dx)+Math.abs(dy);
    if(moved>6){
      svg.classList.add('dragging');
      const r=svg.getBoundingClientRect();
      const sc=VB.w/r.width;
      VB.x-=dx*sc;VB.y-=dy*sc;
      applyVB();
    }
    lastX=e.clientX;lastY=e.clientY;
  });
  const up=e=>{
    ptrs.delete(e.pointerId);
    svg.classList.remove('dragging');
    if(ptrs.size===0){
      if(dragging&&moved<=6){
        const t=downT&&downT.closest?downT.closest('[data-a],[data-p],[data-f],[data-c],[data-s]'):null;
        if(t){
          if(t.hasAttribute('data-f'))seaClick(t.getAttribute('data-f'));
          else if(t.hasAttribute('data-a'))armyClick(t.getAttribute('data-a'));
          else if(t.hasAttribute('data-p'))cityClick(t.getAttribute('data-p'));
          else if(t.hasAttribute('data-c'))cellClick(t.getAttribute('data-c'));
          else seaClick(t.getAttribute('data-s'));
        }
      }
      dragging=false;
    }
  };
  svg.addEventListener('pointerup',up);
  svg.addEventListener('pointercancel',up);
  svg.addEventListener('pointerover',e=>{
    if(!G||!G.targeting||!G.marchInfo)return;
    const t=e.target.closest?e.target.closest('[data-c],[data-a]'):null;
    const k=t?(t.getAttribute('data-c')||t.getAttribute('data-a')):null;
    let hl=[];
    if(k&&G.marchInfo.targets[k]&&!G.marchInfo.targets[k].sea){
      hl=marchPath5(G.selArmy,k,G.marchInfo.parent);
    }
    svg.querySelectorAll('#gCell path').forEach(el=>{
      el.classList.toggle('pathhl',hl.includes(el.getAttribute('data-c')));
    });
  });
  svg.addEventListener('wheel',e=>{
    e.preventDefault();
    const r=svg.getBoundingClientRect();
    const mx=VB.x+(e.clientX-r.left)/r.width*VB.w;
    const my=VB.y+(e.clientY-r.top)/r.height*VB.h;
    const f=e.deltaY>0?1.1:1/1.1;                 // finer, CoN-like zoom steps, centred on the cursor
    const w2=Math.max(180,Math.min(MAPD5.W*1.3,VB.w*f));
    const k=w2/VB.w;
    VB.x=mx-(mx-VB.x)*k;VB.y=my-(my-VB.y)*k;
    VB.w=w2;VB.h=VB.h*k;
    applyVB();
  },{passive:false});
  $('zin').onclick=()=>zoomBy(1/1.18);
  $('zout').onclick=()=>zoomBy(1.18);
  $('zfit').onclick=fitView;
  $('tiltBtn').onclick=()=>{
    const w=$('mapwrap');
    w.classList.toggle('tilted');
    setRailLbl('tiltBtn','Tilt: '+(w.classList.contains('tilted')?'on':'off'));
  };
}


// ==== seg_modal.js ====
let MODAL_PERSIST=false;                    // pass 4f: game-over must not be dismissable, everything else must
function showModal(title,body,btns,opts){
  $('mTitle').innerHTML=title;
  $('mBody').innerHTML=body;
  $('mBtns').innerHTML='';
  btns.forEach(b=>{
    const el=document.createElement('button');
    el.textContent=b[0];
    if(b[2])el.className=b[2];
    el.onclick=b[1];
    $('mBtns').appendChild(el);
  });
  MODAL_PERSIST=!!(opts&&opts.persist);
  $('modal').style.display='flex';
}
function closeModal(){$('modal').style.display='none';MODAL_PERSIST=false;}
function modalOpen(){const m=$('modal');return !!m&&m.style.display==='flex';}
function dismissModal(){if(modalOpen()&&!MODAL_PERSIST)closeModal();}
// One Escape key walks back out of whatever is open, innermost first. There was no keydown handler
// at all before this, so a modal taller than the window could trap you with its Close below the fold.
function initGlobalKeys(){
  document.addEventListener('keydown',ev=>{
    if(ev.key!=='Escape')return;
    if(modalOpen()){dismissModal();return;}
    const ld=$('logdrawer');
    if(ld&&ld.classList.contains('open')){toggleLog(false);return;}
    const dr=$('drawer');
    if(dr&&dr.classList.contains('open')){closeDrawer(true);return;}
    if(G&&G.targeting){G.targeting=false;G.marchInfo=null;renderAll();}
  });
  const m=$('modal');
  if(m)m.addEventListener('mousedown',ev=>{if(ev.target===m)dismissModal();});   // backdrop only, never the box
}

// ==== seg_start.js ====
let selEmpire=null;
let selDiff='norm';
const selRivals=new Set();
function buildStart(){
  const grid=$('empgrid');
  grid.innerHTML='';
  Object.keys(EMPIRES).forEach(k=>{
    const e=EMPIRES[k];
    const d=document.createElement('div');
    d.className='empcard';d.dataset.k=k;
    d.innerHTML='<span class="dot" style="background:'+e.color+'"></span><b>'+e.name+'</b><div class="region">'+e.region+'</div>';
    d.onclick=()=>{selEmpire=k;selRivals.delete(k);refreshStart();};
    grid.appendChild(d);
  });
  const row=$('rivalrow');
  row.innerHTML='';
  Object.keys(EMPIRES).forEach(k=>{
    const d=document.createElement('div');
    d.className='rival';d.dataset.k=k;
    d.textContent=EMPIRES[k].name;
    d.onclick=()=>{
      if(k===selEmpire)return;
      if(selRivals.has(k))selRivals.delete(k);
      else if(selRivals.size<5)selRivals.add(k);
      refreshStart();
    };
    row.appendChild(d);
  });
  const drow=$('diffrow');
  drow.innerHTML='';
  Object.keys(DIFFS).forEach(d=>{
    const el=document.createElement('div');
    el.className='rival';el.dataset.d=d;
    el.textContent=DIFFS[d].name;
    el.onclick=()=>{selDiff=d;refreshStart();};
    drow.appendChild(el);
  });
  refreshStart();
  $('startBtn').onclick=()=>{
    if(!selEmpire||selRivals.size<2)return;
    $('start').style.display='none';
    $('game').style.display='flex';
    newGame(selEmpire,[...selRivals],selDiff);
    buildCadj();
    initMap();
    initInput();
    if(window.innerWidth<761){$('mapwrap').classList.remove('tilted');setRailLbl('tiltBtn','Tilt: off');}   // the 3D tilt softens the map on small screens
    renderAll();
    saveGame();
    const cap=provOf(EMPIRES[selEmpire].cap);
    VB.w=MAPD5.W/3;VB.h=MAPD5.H/3;
    VB.x=cap.cx-VB.w/2;VB.y=cap.cy-VB.h/2;
    applyVB();
  };
}
function refreshStart(){
  document.querySelectorAll('#diffrow .rival').forEach(d=>d.classList.toggle('sel',d.dataset.d===selDiff));
  document.querySelectorAll('.empcard').forEach(d=>d.classList.toggle('sel',d.dataset.k===selEmpire));
  document.querySelectorAll('#rivalrow .rival').forEach(d=>{
    d.classList.toggle('sel',selRivals.has(d.dataset.k));
    d.classList.toggle('off',d.dataset.k===selEmpire);
  });
  const ok=selEmpire&&selRivals.size>=2;
  $('startBtn').disabled=!ok;
  $('startMsg').textContent=!selEmpire?'Select an empire and 2 to 5 rivals.'
    :selRivals.size<2?'Pick at least 2 rivals ('+selRivals.size+' chosen).'
    :'Facing '+selRivals.size+' rivals. May fortune favour you.';
}

$('endTurn').addEventListener('click',endTurn);
$('unitsBtn').addEventListener('click',showUnitCards);
$('techBtn').addEventListener('click',showTech);
$('animBtn').addEventListener('click',()=>{ANIM_ON=!ANIM_ON;setRailLbl('animBtn','Motion: '+(ANIM_ON?'on':'off'));});
$('expBtn').addEventListener('click',exportSave);
$('logBtn').addEventListener('click',()=>toggleLog());
$('helpBtn').addEventListener('click',showHelp);
$('impBtn').addEventListener('click',importSave);
buildStart();
initGlobalKeys();
try{
  const sv=JSON.parse(localStorage.getItem('aoc5save'));
  if(sv&&(sv.cellOwner||sv.provOwner)&&!sv.over){
    const b=$('contBtn');
    b.style.display='inline-block';
    b.textContent='Continue saved game — '+EMPIRES[sv.player].name+', turn '+sv.turn;
    b.addEventListener('click',loadGame);
  }
}catch(e){}
